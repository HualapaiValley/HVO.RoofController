# Roof controller on the Raspberry Pi. See docs/deployment.md.
#
# Two mutually exclusive profiles (both name the container roof-controller, so they cannot run together and they
# collide with a controller started by deploy-roofcontroller-rpi.sh instead of driving the HAT twice):
#
#   pi           HTTPS (default). Publishes only 8443; plain HTTP listens on loopback inside the container for the
#                health check. Needs the certificate directory (HVO_ROOF_CERT_DIR, default /etc/hvo-roof/https) with
#                HVO_ROOF_CERT_FILE (default roof-controller.pfx); its password goes in the secrets directory as a file
#                named Kestrel__Certificates__Default__Password.
#                  docker compose --profile pi up -d
#   pi-lan-http  Plain HTTP on 8080 with RequireHttps off. For an isolated LAN only: API keys and the console access
#                key cross the network in clear text.
#                  docker compose --profile pi-lan-http up -d
#
# A third profile runs the controller against the HAT emulator instead of the HAT. It maps no devices and uses its own
# container and image names and its own network, so it does not collide with either profile above:
#
#   emulator     The controller (Production settings, plain HTTP, published on 127.0.0.1 port HVO_EMULATED_ROOF_PORT,
#                default 5195) and the HAT emulator (src/HVO.RoofControllerV4.Emulator: an emulated roof, SMVector drive,
#                ME-8108 limit switches and SM-I-010 HAT). The emulator's control API has no authentication and is
#                published on 127.0.0.1 port HVO_EMULATOR_CONTROL_PORT (default 5290); its register port stays on the
#                compose network. Both images build for this machine (amd64 or arm64). The controller shows an EMULATED
#                HAT banner, reports Degraded health and does not operate the roof. Give it an admin key of at least 24
#                characters in HVO_EMULATED_ROOF_API_KEY, or its API and console answer 401:
#                  HVO_EMULATED_ROOF_API_KEY=$(openssl rand -hex 24) docker compose --profile emulator up -d --build
#                tests/emulator/compose-smoke-test.sh opens and closes the emulated roof through this profile.
#
# Each Pi profile first runs a one-shot deployment check (--validate-deployment) with the same environment and mounts,
# and the new controller starts only if it passes: roof options valid, a usable RoofOperator or RoofAdmin key, a
# readable and writable identity store, readable settings files in writable directories, and, for HTTPS, a loadable,
# unexpired certificate with its private key. The check reads configuration and writes nothing but probe files it
# removes at once; it maps /dev/i2c-1 only to see
# whether the HAT is present and never opens it.
# `up` stops and replaces a running controller before the check runs, so a failed check leaves NO controller
# running. Run the check on its own first (docs/deployment.md):
#   docker compose --profile pi build && docker compose --profile pi run --rm roof-controller-check

x-roof-environment: &roof-environment
  ASPNETCORE_ENVIRONMENT: Production
  HVO_FORCE_RASPBERRY_PI: "true"
  RoofControllerOptionsV4__IgnorePhysicalLimitSwitches: "false"
  # Never the HAT emulator, as with the deploy script. The secrets directory is read last and can still turn it on; the
  # deployment check then fails, because /dev/i2c-1 is mapped.
  HatEmulator__Enabled: "false"
  HatEmulator__AllowOutsideDevelopment: "false"
  # People, sessions and managed API keys (the identity store), in the directory mounted by identity-mount.
  RoofControllerSecurity__Identity__StorePath: /var/lib/hvo-roof/identity/identity.json
  # The settings changed through the API (appsettings.Local.json, in config-mount) and the secrets set through it (in
  # managed-secrets-mount). A setting given here in the environment overrides both and cannot be changed through the API.
  RoofControllerSettings__FilePath: /etc/hvo-roof/config/appsettings.Local.json
  RoofControllerSettings__SecretsFilePath: /var/lib/hvo-roof/settings-secrets/secrets.json
  # Host names/IPs clients use to reach the controller (semicolon-separated). A list must include localhost (the
  # health check calls it); "*" logs a startup warning.
  AllowedHosts: ${HVO_ROOF_ALLOWED_HOSTS:-*}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-hvo-roof-controller}
  OTEL_RESOURCE_ATTRIBUTES: service.instance.id=${OTEL_SERVICE_INSTANCE_ID:-roof-controller-rpi}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://192.168.1.238:4318}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-10000}

x-https-environment: &https-environment
  <<: *roof-environment
  # HTTP on loopback only (health check, in-container calls); remote clients use HTTPS.
  ASPNETCORE_URLS: "http://localhost:8080;https://+:8443"
  RoofControllerSecurity__RequireHttps: "true"
  Kestrel__Certificates__Default__Path: /https/${HVO_ROOF_CERT_FILE:-roof-controller.pfx}

x-lan-http-environment: &lan-http-environment
  <<: *roof-environment
  ASPNETCORE_URLS: "http://+:8080"
  # Explicit opt-out: accept plain HTTP from the LAN (a warning is logged at startup).
  RoofControllerSecurity__RequireHttps: "false"

# One file per secret setting, named after its configuration key (API keys, BlueIris__Password, certificate
# password). Read by the app through AddKeyPerFile("/run/secrets"). Never commit these files. The directory must
# exist: it is not created (an empty directory would start a controller with no keys).
x-secrets-mount: &secrets-mount
  type: bind
  source: ${HVO_ROOF_SECRETS_DIR:-/etc/hvo-roof/secrets}
  target: /run/secrets
  read_only: true
  bind:
    create_host_path: false

x-cert-mount: &cert-mount
  type: bind
  source: ${HVO_ROOF_CERT_DIR:-/etc/hvo-roof/https}
  target: /https
  read_only: true
  bind:
    create_host_path: false

# The identity store: people, sessions and managed API keys, kept in one owner-only file that the controller writes.
# Read-write, and the directory must exist (sudo install -d -m 0700 /var/lib/hvo-roof/identity): it is not created,
# so a mistyped path fails the deployment check instead of starting a controller that forgets everyone. Back it up with
# the secrets directory.
x-identity-mount: &identity-mount
  type: bind
  source: ${HVO_ROOF_IDENTITY_DIR:-/var/lib/hvo-roof/identity}
  target: /var/lib/hvo-roof/identity
  bind:
    create_host_path: false

# The settings file (appsettings.Local.json): the settings changed from the shipped defaults, through the API or by hand
# (docs/commissioning.md). Read-write, and the directory must exist (sudo install -d -m 0755 /etc/hvo-roof/config).
x-config-mount: &config-mount
  type: bind
  source: ${HVO_ROOF_CONFIG_DIR:-/etc/hvo-roof/config}
  target: /etc/hvo-roof/config
  bind:
    create_host_path: false

# The managed secrets file: secrets set through the API, owner-only. Read-write, and the directory must exist
# (sudo install -d -m 0700 /var/lib/hvo-roof/settings-secrets). Back it up with the secrets directory.
x-managed-secrets-mount: &managed-secrets-mount
  type: bind
  source: ${HVO_ROOF_MANAGED_SECRETS_DIR:-/var/lib/hvo-roof/settings-secrets}
  target: /var/lib/hvo-roof/settings-secrets
  bind:
    create_host_path: false

x-thermal-mount: &thermal-mount
  type: bind
  source: /sys/class/thermal/thermal_zone0/temp
  target: /sys/class/thermal/thermal_zone0/temp
  read_only: true

# Log rotation for the long-running services (the Pi controllers and the emulator rig, which a soak runs).
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-roof-controller: &roof-controller
  image: hvov9/roof-controller:v4
  build:
    context: ../..
    dockerfile: "src/HVO.RoofControllerV4.RPi/Dockerfile"
    platforms:
      - linux/arm64
  container_name: roof-controller
  restart: unless-stopped
  # SIGTERM first: the host stops the roof (verified all-off) and ends camera streams before exiting.
  # Must stay above the app's HostOptions.ShutdownTimeout (20 s).
  stop_grace_period: 30s
  devices:
    - "/dev/gpiomem:/dev/gpiomem"
    - "/dev/i2c-1:/dev/i2c-1"
  healthcheck:
    test: [ "CMD", "curl", "-f", "http://localhost:8080/health/ready" ]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  logging: *logging

x-deployment-check: &deployment-check
  image: hvov9/roof-controller:v4
  # Built by the controller service; never pulled.
  pull_policy: never
  command: [ "--validate-deployment" ]
  restart: "no"
  network_mode: none
  # Its presence decides whether the limit-switch override is on the roof hardware; the check never opens it.
  devices:
    - "/dev/i2c-1:/dev/i2c-1"
  healthcheck:
    disable: true

# The controller against the HAT emulator (profile emulator). Production settings, with the HAT emulator allowed
# explicitly (HatEmulator__AllowOutsideDevelopment): a deployment's configuration except for the HAT, HTTPS and the
# cameras.
x-emulated-environment: &emulated-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: "http://+:8080"
  # Plain HTTP, published on loopback only (a warning is logged at startup).
  RoofControllerSecurity__RequireHttps: "false"
  RoofControllerSecurity__ApiKeys__0__Name: emulator-admin
  RoofControllerSecurity__ApiKeys__0__Role: RoofAdmin
  RoofControllerSecurity__ApiKeys__0__Key: ${HVO_EMULATED_ROOF_API_KEY:-}
  HatEmulator__Enabled: "true"
  HatEmulator__Host: hat-emulator
  HatEmulator__Port: "5291"
  HatEmulator__AllowOutsideDevelopment: "true"
  # The limit switches come from the emulator: the documented normally-open wiring, never ignored.
  RoofControllerOptionsV4__UseNormallyClosedLimitSwitches: "false"
  RoofControllerOptionsV4__IgnorePhysicalLimitSwitches: "false"
  # The emulator's MJPEG camera of the plant, on its control port, without credentials.
  BlueIris__BaseUrl: http://hat-emulator:5290
  BlueIris__UserName: ""
  BlueIris__Password: ""
  AllowedHosts: "*"
  # Telemetry only when an endpoint is given; the resource carries hvo.roof.hat.mode=emulated.
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-hvo-roof-controller}
  OTEL_RESOURCE_ATTRIBUTES: service.instance.id=${HVO_EMULATED_ROOF_INSTANCE_ID:-roof-controller-emulated}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${HVO_EMULATED_ROOF_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}

services:
  roof-controller-check:
    <<: *deployment-check
    environment: *https-environment
    volumes:
      - *secrets-mount
      - *cert-mount
      - *identity-mount
      - *config-mount
      - *managed-secrets-mount
    profiles:
      - pi

  roof-controller:
    <<: *roof-controller
    depends_on:
      roof-controller-check:
        condition: service_completed_successfully
    ports:
      - "8443:8443"
    environment: *https-environment
    volumes:
      - *thermal-mount
      - *secrets-mount
      - *cert-mount
      - *identity-mount
      - *config-mount
      - *managed-secrets-mount
    profiles:
      - pi

  roof-controller-lan-http-check:
    <<: *deployment-check
    environment: *lan-http-environment
    volumes:
      - *secrets-mount
      - *identity-mount
      - *config-mount
      - *managed-secrets-mount
    profiles:
      - pi-lan-http

  roof-controller-lan-http:
    <<: *roof-controller
    depends_on:
      roof-controller-lan-http-check:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment: *lan-http-environment
    volumes:
      - *thermal-mount
      - *secrets-mount
      - *identity-mount
      - *config-mount
      - *managed-secrets-mount
    profiles:
      - pi-lan-http

  hat-emulator:
    image: hvo/roof-hat-emulator:dev
    build:
      context: ../..
      dockerfile: "src/HVO.RoofControllerV4.Emulator/Dockerfile"
    environment:
      Emulator__TimeScale: ${HVO_EMULATOR_TIME_SCALE:-1}
      Emulator__CameraFramesPerSecond: ${HVO_EMULATOR_CAMERA_FPS:-5}
    ports:
      # The control API has no authentication: loopback only.
      - "127.0.0.1:${HVO_EMULATOR_CONTROL_PORT:-5290}:5290"
    restart: "no"
    logging: *logging
    networks:
      - emulator
    profiles:
      - emulator

  roof-controller-emulated:
    image: hvo/roof-controller:emulated
    build:
      context: ../..
      dockerfile: "src/HVO.RoofControllerV4.RPi/Dockerfile"
    depends_on:
      hat-emulator:
        condition: service_healthy
    environment: *emulated-environment
    ports:
      - "127.0.0.1:${HVO_EMULATED_ROOF_PORT:-5195}:8080"
    restart: "no"
    stop_grace_period: 30s
    logging: *logging
    networks:
      - emulator
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles:
      - emulator

networks:
  # The emulator rig's own network, so a Pi-profile controller cannot reach the HAT emulator.
  emulator:
