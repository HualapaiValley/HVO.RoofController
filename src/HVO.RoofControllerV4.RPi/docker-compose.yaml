services:
  roof-controller:
    image: hvov9/roof-controller:v4
    build:
      context: ../..
      dockerfile: "src/HVO.RoofControllerV4.RPi/Dockerfile"
      platforms:
        - linux/arm64
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HVO_FORCE_RASPBERRY_PI: "true"
      RoofControllerOptionsV4__IgnorePhysicalLimitSwitches: "false"
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-hvo-roof-controller}
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=${OTEL_SERVICE_INSTANCE_ID:-roof-controller-rpi}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://192.168.1.238:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-10000}
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/i2c-1:/dev/i2c-1"
    volumes:
      - type: bind
        source: /sys/class/thermal/thermal_zone0/temp
        target: /sys/class/thermal/thermal_zone0/temp
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    profiles:
      - pi
