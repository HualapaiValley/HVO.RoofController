# Local development only. Builds the Pi image and the HAT emulator image for the local machine and runs the controller
# with the Development environment against the HAT emulator (an emulated roof, drive, limit switches and HAT); no
# hardware devices are mapped. Browse to http://localhost:5288 (HVO_DEV_WEB_PORT moves it) for the web UI; the
# controller's API is on http://localhost:5200 (HVO_DEV_ROOF_PORT moves it). API keys still apply: give an admin
# key of at least 24 characters in HVO_DEV_ROOF_API_KEY (docs/security.md), for example
#   HVO_DEV_ROOF_API_KEY=$(openssl rand -hex 24) docker compose up --build
# The emulator's control API (fault injection, docs/emulator.md) is on http://127.0.0.1:5290 (HVO_EMULATOR_CONTROL_PORT
# moves it); it has no authentication, so it is published on loopback only.
#
# Do not use this file to deploy to the observatory Pi. Production uses
# src/HVO.RoofControllerV4.RPi/docker-compose.yaml through the deployment script, which stops
# the roof safely before replacing the container; see docs/deployment.md.
# The product version and commit the images are built for (docs/releasing.md): HVO_ROOF_VERSION (4.0.0-dev, say),
# HVO_ROOF_REVISION (the commit) and HVO_ROOF_CREATED (an RFC 3339 time). Left empty, an image carries
# Directory.Build.props's 4.0.0-dev without a commit and has empty version labels.
x-build-args: &build-args
  ROOF_VERSION: ${HVO_ROOF_VERSION:-}
  ROOF_REVISION: ${HVO_ROOF_REVISION:-}
  ROOF_CREATED: ${HVO_ROOF_CREATED:-}

services:
  hat-emulator:
    build:
      context: ..
      dockerfile: src/HVO.RoofControllerV4.Emulator/Dockerfile
      args: *build-args
    image: hvo/roof-hat-emulator:dev
    container_name: hvo-roof-hat-emulator
    environment:
      - Emulator__TimeScale=${HVO_EMULATOR_TIME_SCALE:-1}
    ports:
      # The control API has no authentication: loopback only.
      - "127.0.0.1:${HVO_EMULATOR_CONTROL_PORT:-5290}:5290"
    networks:
      - hvo-network

  roofcontroller:
    build:
      context: ..
      dockerfile: src/HVO.RoofControllerV4.RPi/Dockerfile
      args: *build-args
    image: hvo/roofcontrollerv4:rpi-dev
    container_name: hvo-roofcontrollerv4
    depends_on:
      hat-emulator:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # appsettings.Development.json turns the HAT emulator on; here it is the hat-emulator service.
      - HatEmulator__Host=hat-emulator
      # And the camera is the emulator's MJPEG camera of the emulated roof.
      - BlueIris__BaseUrl=http://hat-emulator:5290
      - RoofControllerSecurity__ApiKeys__0__Name=dev-admin
      - RoofControllerSecurity__ApiKeys__0__Role=RoofAdmin
      - RoofControllerSecurity__ApiKeys__0__Key=${HVO_DEV_ROOF_API_KEY:-}
    ports:
      - "${HVO_DEV_ROOF_PORT:-5200}:8080"
      - "${HVO_DEV_WEB_PORT:-5288}:8088"
    # docker stop: the supervisor stops the controller (up to 25 s), then the web UI (2 s).
    stop_grace_period: 30s
    networks:
      - hvo-network

networks:
  hvo-network:
    name: hvo-network
    driver: bridge
