<text x="28.80" y="55.50" fill="#abb0b7" textLength="201.60" lengthAdjust="spacingAndGlyphs">HVO Roof installer 4.0.0</text>
<text x="20.40" y="73.50" fill="#f8fafc" textLength="235.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">Step 5 of 7: Review the plan</text>
<text x="37.20" y="91.50" fill="#f8fafc" textLength="126.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">Review the plan</text>
<text x="45.60" y="109.50" fill="#f8fafc" textLength="50.40" lengthAdjust="spacingAndGlyphs">create</text>
<text x="138.00" y="109.50" fill="#f8fafc" textLength="512.40" lengthAdjust="spacingAndGlyphs">/etc/hvo-roof/secrets/RoofControllerSecurity__ApiKeys__2__Key</text>
<text x="667.20" y="109.50" fill="#f8fafc" textLength="134.40" lengthAdjust="spacingAndGlyphs">the web UI's own</text>
<text x="826.80" y="109.50" fill="#f8fafc">▲</text>
<text x="138.00" y="127.50" fill="#f8fafc" textLength="646.80" lengthAdjust="spacingAndGlyphs">key for Stop (never shown) (web-ui-stop (RoofViewer): a new random key, never</text>
<text x="826.80" y="127.50" fill="#f8fafc">░</text>
<text x="138.00" y="145.50" fill="#f8fafc" textLength="50.40" lengthAdjust="spacingAndGlyphs">shown)</text>
<text x="826.80" y="145.50" fill="#f8fafc">░</text>
<text x="45.60" y="163.50" fill="#f8fafc" textLength="50.40" lengthAdjust="spacingAndGlyphs">create</text>
<text x="138.00" y="163.50" fill="#f8fafc" textLength="218.40" lengthAdjust="spacingAndGlyphs">/etc/hvo-roof/install.json</text>
<text x="524.40" y="163.50" fill="#f8fafc" textLength="252.00" lengthAdjust="spacingAndGlyphs">the install record: the roles,</text>
<text x="826.80" y="163.50" fill="#f8fafc">░</text>
<text x="138.00" y="181.50" fill="#f8fafc" textLength="336.00" lengthAdjust="spacingAndGlyphs">choices and versions (no secrets) (0644)</text>
<text x="826.80" y="181.50" fill="#f8fafc">░</text>
<text x="28.80" y="199.50" fill="#f8fafc" textLength="67.20" lengthAdjust="spacingAndGlyphs">Packages</text>
<text x="826.80" y="199.50" fill="#f8fafc">░</text>
<text x="45.60" y="217.50" fill="#f8fafc" textLength="33.60" lengthAdjust="spacingAndGlyphs">info</text>
<text x="138.00" y="217.50" fill="#f8fafc" textLength="344.40" lengthAdjust="spacingAndGlyphs">bash, curl, setsid or perl, jq or python3</text>
<text x="524.40" y="217.50" fill="#f8fafc" textLength="285.60" lengthAdjust="spacingAndGlyphs">what the deploy script runs (found</text>
<text x="826.80" y="217.50" fill="#f8fafc">░</text>
<text x="138.00" y="235.50" fill="#f8fafc" textLength="193.20" lengthAdjust="spacingAndGlyphs">bash, curl, setsid, jq)</text>
<text x="826.80" y="235.50" fill="#f8fafc">░</text>
<text x="28.80" y="253.50" fill="#f8fafc" textLength="84.00" lengthAdjust="spacingAndGlyphs">Containers</text>
<text x="826.80" y="253.50" fill="#f8fafc">░</text>
<text x="45.60" y="271.50" fill="#f8fafc" textLength="58.80" lengthAdjust="spacingAndGlyphs">blocked</text>
<text x="138.00" y="271.50" fill="#f8fafc" textLength="126.00" lengthAdjust="spacingAndGlyphs">roof-controller</text>
<text x="524.40" y="271.50" fill="#f8fafc" textLength="310.80" lengthAdjust="spacingAndGlyphs">the controller, driving the real HAT░</text>
<text x="138.00" y="289.50" fill="#f8fafc" textLength="663.60" lengthAdjust="spacingAndGlyphs">Docker Compose made it (project hvo-roofcontroller-rpi), and the installer does</text>
<text x="826.80" y="289.50" fill="#f8fafc">░</text>
<text x="138.00" y="307.50" fill="#f8fafc" textLength="672.00" lengthAdjust="spacingAndGlyphs">not replace it. To move it to the installer, see "Moving between Compose and the</text>
<text x="826.80" y="307.50" fill="#f8fafc">░</text>
<text x="138.00" y="325.50" fill="#f8fafc" textLength="310.80" lengthAdjust="spacingAndGlyphs">deploy script" in docs/deployment.md.</text>
<text x="28.80" y="343.50" fill="#f8fafc" textLength="42.00" lengthAdjust="spacingAndGlyphs">Ports</text>
<text x="45.60" y="361.50" fill="#f8fafc" textLength="33.60" lengthAdjust="spacingAndGlyphs">info</text>
<text x="138.00" y="361.50" fill="#f8fafc" textLength="33.60" lengthAdjust="spacingAndGlyphs">8443</text>
<text x="524.40" y="361.50" fill="#f8fafc" textLength="294.00" lengthAdjust="spacingAndGlyphs">the controller's API (HTTPS) (free;</text>
<text x="138.00" y="379.50" fill="#f8fafc" textLength="285.60" lengthAdjust="spacingAndGlyphs">roof-controller will listen on it)</text>
<text x="45.60" y="397.50" fill="#f8fafc" textLength="33.60" lengthAdjust="spacingAndGlyphs">info</text>
<text x="138.00" y="397.50" fill="#f8fafc" textLength="33.60" lengthAdjust="spacingAndGlyphs">8088</text>
<text x="524.40" y="397.50" fill="#f8fafc" textLength="277.20" lengthAdjust="spacingAndGlyphs">the web UI (free; roof-controller</text>
<text x="138.00" y="415.50" fill="#f8fafc" textLength="151.20" lengthAdjust="spacingAndGlyphs">will listen on it)</text>
<text x="28.80" y="451.50" fill="#f8fafc" textLength="520.80" lengthAdjust="spacingAndGlyphs">Blocked: 1 step cannot go ahead, so nothing will be installed.</text>
<text x="826.80" y="451.50" fill="#f8fafc">▼</text>
<text x="28.80" y="487.50" fill="#f8fafc" textLength="294.00" lengthAdjust="spacingAndGlyphs">Save these answers (no secrets) to:</text>
<text x="28.80" y="505.50" fill="#f8fafc" textLength="226.80" lengthAdjust="spacingAndGlyphs">/root/hvo-roof-answers.json</text>
