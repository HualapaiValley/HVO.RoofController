<text x="28.80" y="55.50" fill="#abb0b7" textLength="201.60" lengthAdjust="spacingAndGlyphs">HVO Roof installer 4.0.0</text>
<text x="20.40" y="73.50" fill="#f8fafc" textLength="344.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">Step 4 of 7: Connecting to the controller</text>
<text x="37.20" y="91.50" fill="#f8fafc" textLength="235.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">Connecting to the controller</text>
<text x="28.80" y="109.50" fill="#f8fafc" textLength="319.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">The controller the Mac app connects to</text>
<text x="45.60" y="127.50" fill="#f8fafc" textLength="67.20" lengthAdjust="spacingAndGlyphs">Address:</text>
<text x="247.20" y="127.50" fill="#f8fafc" textLength="210.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">https://roofpi.local:8443</text>
<text x="633.60" y="127.50" fill="#f8fafc" textLength="134.40" lengthAdjust="spacingAndGlyphs">⟦ Fetch its CA ⟧</text>
<text x="45.60" y="145.50" fill="#f8fafc" textLength="562.80" lengthAdjust="spacingAndGlyphs">As this machine reaches it, with its port: https://roof.local:8443.</text>
<text x="28.80" y="181.50" fill="#f8fafc" textLength="210.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">How the Mac app trusts it</text>
<text x="45.60" y="199.50" fill="#f8fafc" textLength="646.80" lengthAdjust="spacingAndGlyphs">◉ Its private CA: fetched from it, and trusted once you check its fingerprint</text>
<text x="45.60" y="217.50" fill="#f8fafc" textLength="470.40" lengthAdjust="spacingAndGlyphs">○ Its self-signed certificate, pinned to its fingerprint</text>
<text x="45.60" y="235.50" fill="#f8fafc" textLength="655.20" lengthAdjust="spacingAndGlyphs">○ As this machine trusts any website: a certificate of your own, or plain HTTP</text>
<text x="45.60" y="271.50" fill="#f8fafc" textLength="604.80" lengthAdjust="spacingAndGlyphs">It serves HVO Roof CA (roofpi, 2026-10-01), whose SHA-256 fingerprint is</text>
<text x="62.40" y="289.50" fill="#f8fafc" textLength="403.20" lengthAdjust="spacingAndGlyphs">FB:26:8B:E2:34:20:52:AF:FB:D8:05:14:87:EB:B5:D6:</text>
<text x="62.40" y="307.50" fill="#f8fafc" textLength="394.80" lengthAdjust="spacingAndGlyphs">4A:D8:6D:4E:65:BC:35:26:C7:D2:31:11:2A:D1:C0:76</text>
<text x="45.60" y="325.50" fill="#f8fafc" textLength="756.00" lengthAdjust="spacingAndGlyphs">Does it match the controller's installer's Done page, or hvo-roof-install cert show on it?</text>
<text x="45.60" y="343.50" fill="#f8fafc" textLength="495.60" lengthAdjust="spacingAndGlyphs">☑ It is the fingerprint the controller shows: trust this CA</text>
<text x="45.60" y="361.50" fill="#f8fafc" textLength="747.60" lengthAdjust="spacingAndGlyphs">☑ Trust it in my login keychain too, for Safari and Chrome (macOS asks for your password)</text>
<text x="28.80" y="397.50" fill="#f8fafc" textLength="201.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">The Mac app's device key</text>
<text x="45.60" y="415.50" fill="#f8fafc" textLength="151.20" lengthAdjust="spacingAndGlyphs">Made by the admin:</text>
<text x="247.20" y="415.50" fill="#f8fafc" textLength="25.20" lengthAdjust="spacingAndGlyphs">ada</text>
<text x="45.60" y="433.50" fill="#f8fafc" textLength="730.80" lengthAdjust="spacingAndGlyphs">An admin on the controller, by the name they sign in with. They sign in once, after the</text>
<text x="45.60" y="451.50" fill="#f8fafc" textLength="772.80" lengthAdjust="spacingAndGlyphs">review, so the installer can make the Mac's own key (a viewer's): it goes in a file only you</text>
<text x="45.60" y="469.50" fill="#f8fafc" textLength="243.60" lengthAdjust="spacingAndGlyphs">can read, and is never shown.</text>
<text x="20.40" y="541.50" fill="#f8fafc" textLength="67.20" lengthAdjust="spacingAndGlyphs">⟦ Back ⟧</text>
<text x="112.80" y="541.50" fill="#f8fafc" textLength="84.00" lengthAdjust="spacingAndGlyphs">⟦► Next ◄⟧</text>
<text x="20.40" y="559.50" fill="#3b82f6" textLength="42.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">Enter</text>
<text x="70.80" y="559.50" fill="#abb0b7" textLength="33.60" lengthAdjust="spacingAndGlyphs">Next</text>
<text x="121.20" y="559.50" fill="#3b82f6" textLength="25.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">Esc</text>
<text x="154.80" y="559.50" fill="#abb0b7" textLength="33.60" lengthAdjust="spacingAndGlyphs">Back</text>
<text x="205.20" y="559.50" fill="#3b82f6" textLength="25.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">F10</text>
<text x="238.80" y="559.50" fill="#abb0b7" textLength="33.60" lengthAdjust="spacingAndGlyphs">Quit</text>
