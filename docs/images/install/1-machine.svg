<text x="28.80" y="55.50" fill="#e5e5e5" textLength="201.60" lengthAdjust="spacingAndGlyphs">HVO Roof installer 4.0.0</text>
<text x="20.40" y="73.50" fill="#ffffff" textLength="210.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">Step 1 of 6: This machine</text>
<text x="37.20" y="91.50" fill="#ffffff" textLength="100.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">This machine</text>
<text x="28.80" y="109.50" fill="#ffffff" textLength="798.00" lengthAdjust="spacingAndGlyphs">The installer looked at this machine and changed nothing. Next chooses what to install; nothing</text>
<text x="28.80" y="127.50" fill="#ffffff" textLength="336.00" lengthAdjust="spacingAndGlyphs">is installed before you review the plan.</text>
<text x="28.80" y="163.50" fill="#ffffff" textLength="67.20" lengthAdjust="spacingAndGlyphs">Machine:</text>
<text x="138.00" y="163.50" fill="#ffffff" textLength="436.80" lengthAdjust="spacingAndGlyphs">roofpi (linux-arm64, Debian GNU/Linux 12 (bookworm))</text>
<text x="826.80" y="163.50" fill="#ffffff">▲</text>
<text x="28.80" y="181.50" fill="#ffffff" textLength="92.40" lengthAdjust="spacingAndGlyphs">Running as:</text>
<text x="138.00" y="181.50" fill="#ffffff" textLength="33.60" lengthAdjust="spacingAndGlyphs">root</text>
<text x="28.80" y="199.50" fill="#ffffff" textLength="25.20" lengthAdjust="spacingAndGlyphs">Pi:</text>
<text x="138.00" y="199.50" fill="#ffffff" textLength="252.00" lengthAdjust="spacingAndGlyphs">Raspberry Pi 5 Model B Rev 1.0</text>
<text x="28.80" y="217.50" fill="#ffffff" textLength="546.00" lengthAdjust="spacingAndGlyphs">HAT devices: /dev/i2c-1, /dev/gpiomem, the thermal sensor present</text>
<text x="28.80" y="235.50" fill="#ffffff" textLength="58.80" lengthAdjust="spacingAndGlyphs">Docker:</text>
<text x="138.00" y="235.50" fill="#ffffff" textLength="184.80" lengthAdjust="spacingAndGlyphs">27.3.1, Compose 2.29.7</text>
<text x="138.00" y="253.50" fill="#ffffff" textLength="646.80" lengthAdjust="spacingAndGlyphs">enforces memory limits yes, CPU yes, processes yes, swap yes; reports 4 CPUs,</text>
<text x="138.00" y="271.50" fill="#ffffff" textLength="126.00" lengthAdjust="spacingAndGlyphs">8192m of memory</text>
<text x="28.80" y="289.50" fill="#ffffff" textLength="75.60" lengthAdjust="spacingAndGlyphs">Recorded:</text>
<text x="138.00" y="289.50" fill="#ffffff" textLength="462.00" lengthAdjust="spacingAndGlyphs">nothing in the machine's record; nothing in your record</text>
<text x="28.80" y="307.50" fill="#ffffff" textLength="50.40" lengthAdjust="spacingAndGlyphs">Found:</text>
<text x="138.00" y="307.50" fill="#ffffff" textLength="361.20" lengthAdjust="spacingAndGlyphs">/etc/hvo-roof, set up without the installer</text>
<text x="28.80" y="325.50" fill="#ffffff" textLength="84.00" lengthAdjust="spacingAndGlyphs">Container:</text>
<text x="138.00" y="325.50" fill="#ffffff" textLength="613.20" lengthAdjust="spacingAndGlyphs">roof-controller: running, 4.0.0, the real HAT (made by the deploy script)</text>
<text x="28.80" y="343.50" fill="#ffffff" textLength="680.40" lengthAdjust="spacingAndGlyphs">Certificate: roofpi, until 2027-11-02, issued by HVO Roof CA (roofpi, 2026-10-01)</text>
<text x="28.80" y="361.50" fill="#ffffff" textLength="25.20" lengthAdjust="spacingAndGlyphs">CA:</text>
<text x="138.00" y="361.50" fill="#ffffff" textLength="420.00" lengthAdjust="spacingAndGlyphs">HVO Roof CA (roofpi, 2026-10-01), until 2036-09-28</text>
<text x="28.80" y="397.50" fill="#ffffff" textLength="747.60" lengthAdjust="spacingAndGlyphs">Physical controller: only on the intended Raspberry Pi, enable I2C with sudo raspi-config</text>
<text x="28.80" y="415.50" fill="#ffffff" textLength="772.80" lengthAdjust="spacingAndGlyphs">nonint do_i2c 0 if needed, reboot, then rerun the installer. Missing GPIO or thermal devices</text>
<text x="28.80" y="433.50" fill="#ffffff" textLength="546.00" lengthAdjust="spacingAndGlyphs">are not fixed by enabling I2C. Elsewhere choose the emulated rig.</text>
<text x="826.80" y="433.50" fill="#ffffff">░</text>
<text x="28.80" y="451.50" fill="#ffffff" textLength="806.40" lengthAdjust="spacingAndGlyphs">Kiosk: a connected DRM display and console boot are required. If a desktop owns it, explicitly ░</text>
<text x="28.80" y="469.50" fill="#ffffff" textLength="688.80" lengthAdjust="spacingAndGlyphs">select sudo systemctl set-default multi-user.target and reboot before retrying. No</text>
<text x="826.80" y="469.50" fill="#ffffff">░</text>
<text x="28.80" y="487.50" fill="#ffffff" textLength="386.40" lengthAdjust="spacingAndGlyphs">display-manager change or reboot is automatic.</text>
<text x="826.80" y="487.50" fill="#ffffff">░</text>
<text x="28.80" y="505.50" fill="#ffffff" textLength="722.40" lengthAdjust="spacingAndGlyphs">Splash: optional on Raspberry Pi OS or Ubuntu with GRUB. Requires Python 3; install it</text>
<text x="826.80" y="505.50" fill="#ffffff">▼</text>
<text x="20.40" y="541.50" fill="#e5e5e5" textLength="67.20" lengthAdjust="spacingAndGlyphs" opacity="0.6">⟦ Back ⟧</text>
