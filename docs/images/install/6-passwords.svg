<text x="28.80" y="55.50" fill="#98a7bb" textLength="201.60" lengthAdjust="spacingAndGlyphs">HVO Roof installer 4.0.0</text>
<text x="20.40" y="73.50" fill="#f7f9fc" textLength="184.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">Step 6 of 8: Passwords</text>
<text x="37.20" y="91.50" fill="#f7f9fc" textLength="75.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">Passwords</text>
<text x="28.80" y="109.50" fill="#f7f9fc" textLength="453.60" lengthAdjust="spacingAndGlyphs">Each is typed twice, and never shown, saved or logged.</text>
<text x="28.80" y="145.50" fill="#f7f9fc" textLength="226.80" lengthAdjust="spacingAndGlyphs">The first admin's password:</text>
<text x="280.80" y="145.50" fill="#f7f9fc" textLength="168.00" lengthAdjust="spacingAndGlyphs">∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙</text>
<text x="45.60" y="163.50" fill="#f7f9fc" textLength="50.40" lengthAdjust="spacingAndGlyphs">Again:</text>
<text x="280.80" y="163.50" fill="#f7f9fc" textLength="168.00" lengthAdjust="spacingAndGlyphs">∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙</text>
<text x="45.60" y="181.50" fill="#f7f9fc" textLength="327.60" lengthAdjust="spacingAndGlyphs">A password must be 7 to 256 characters.</text>
<text x="28.80" y="217.50" fill="#f7f9fc" textLength="184.80" lengthAdjust="spacingAndGlyphs">The first admin's PIN:</text>
<text x="280.80" y="217.50" fill="#f7f9fc" textLength="33.60" lengthAdjust="spacingAndGlyphs">∙∙∙∙</text>
<text x="45.60" y="235.50" fill="#f7f9fc" textLength="50.40" lengthAdjust="spacingAndGlyphs">Again:</text>
<text x="280.80" y="235.50" fill="#f7f9fc" textLength="84.00" lengthAdjust="spacingAndGlyphs">∙∙∙∙∙∙∙∙∙∙</text>
<text x="45.60" y="253.50" fill="#f7f9fc" textLength="638.40" lengthAdjust="spacingAndGlyphs">A PIN must be exactly 4 digits; the temporary commissioning PIN is reserved.</text>
<text x="28.80" y="289.50" fill="#f7f9fc" textLength="184.80" lengthAdjust="spacingAndGlyphs">The camera's password:</text>
<text x="280.80" y="289.50" fill="#f7f9fc" textLength="168.00" lengthAdjust="spacingAndGlyphs">∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙</text>
<text x="45.60" y="307.50" fill="#f7f9fc" textLength="50.40" lengthAdjust="spacingAndGlyphs">Again:</text>
<text x="280.80" y="307.50" fill="#f7f9fc" textLength="168.00" lengthAdjust="spacingAndGlyphs">∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙</text>
<text x="20.40" y="523.50" fill="#fecaca" textLength="512.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">The first admin's PIN: the two differ. Type it again in both.</text>
<text x="20.40" y="541.50" fill="#f7f9fc" textLength="67.20" lengthAdjust="spacingAndGlyphs">[ Back ]</text>
<text x="104.40" y="541.50" fill="#f7f9fc" textLength="126.00" lengthAdjust="spacingAndGlyphs">[ ► Install ◄ ]</text>
<text x="20.40" y="559.50" fill="#58a6ff" textLength="42.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">Enter</text>
<text x="70.80" y="559.50" fill="#98a7bb" textLength="58.80" lengthAdjust="spacingAndGlyphs">Install</text>
<text x="146.40" y="559.50" fill="#58a6ff" textLength="25.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">Esc</text>
<text x="180.00" y="559.50" fill="#98a7bb" textLength="33.60" lengthAdjust="spacingAndGlyphs">Back</text>
<text x="230.40" y="559.50" fill="#58a6ff" textLength="25.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">F10</text>
<text x="264.00" y="559.50" fill="#98a7bb" textLength="33.60" lengthAdjust="spacingAndGlyphs">Quit</text>
