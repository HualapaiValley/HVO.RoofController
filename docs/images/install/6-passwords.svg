<text x="28.80" y="55.50" fill="#abb0b7" textLength="201.60" lengthAdjust="spacingAndGlyphs">HVO Roof installer 4.0.0</text>
<text x="20.40" y="73.50" fill="#f8fafc" textLength="184.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">Step 6 of 8: Passwords</text>
<text x="37.20" y="91.50" fill="#f8fafc" textLength="75.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">Passwords</text>
<text x="28.80" y="109.50" fill="#f8fafc" textLength="453.60" lengthAdjust="spacingAndGlyphs">Each is typed twice, and never shown, saved or logged.</text>
<text x="28.80" y="145.50" fill="#f8fafc" textLength="226.80" lengthAdjust="spacingAndGlyphs">The first admin's password:</text>
<text x="280.80" y="145.50" fill="#f8fafc" textLength="168.00" lengthAdjust="spacingAndGlyphs">∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙</text>
<text x="45.60" y="163.50" fill="#f8fafc" textLength="50.40" lengthAdjust="spacingAndGlyphs">Again:</text>
<text x="280.80" y="163.50" fill="#f8fafc" textLength="168.00" lengthAdjust="spacingAndGlyphs">∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙</text>
<text x="45.60" y="181.50" fill="#f8fafc" textLength="336.00" lengthAdjust="spacingAndGlyphs">A password must be 12 to 256 characters.</text>
<text x="28.80" y="217.50" fill="#f8fafc" textLength="184.80" lengthAdjust="spacingAndGlyphs">The first admin's PIN:</text>
<text x="280.80" y="217.50" fill="#f8fafc" textLength="84.00" lengthAdjust="spacingAndGlyphs">∙∙∙∙∙∙∙∙∙∙</text>
<text x="45.60" y="235.50" fill="#f8fafc" textLength="50.40" lengthAdjust="spacingAndGlyphs">Again:</text>
<text x="280.80" y="235.50" fill="#f8fafc" textLength="84.00" lengthAdjust="spacingAndGlyphs">∙∙∙∙∙∙∙∙∙∙</text>
<text x="45.60" y="253.50" fill="#f8fafc" textLength="243.60" lengthAdjust="spacingAndGlyphs">A PIN must be 6 to 12 digits.</text>
<text x="28.80" y="289.50" fill="#f8fafc" textLength="184.80" lengthAdjust="spacingAndGlyphs">The camera's password:</text>
<text x="280.80" y="289.50" fill="#f8fafc" textLength="168.00" lengthAdjust="spacingAndGlyphs">∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙</text>
<text x="45.60" y="307.50" fill="#f8fafc" textLength="50.40" lengthAdjust="spacingAndGlyphs">Again:</text>
<text x="280.80" y="307.50" fill="#f8fafc" textLength="168.00" lengthAdjust="spacingAndGlyphs">∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙∙</text>
<text x="20.40" y="541.50" fill="#f8fafc" textLength="67.20" lengthAdjust="spacingAndGlyphs">⟦ Back ⟧</text>
<text x="112.80" y="541.50" fill="#f8fafc" textLength="109.20" lengthAdjust="spacingAndGlyphs">⟦► Install ◄⟧</text>
<text x="247.20" y="541.50" fill="#fecaca" textLength="512.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">The first admin's PIN: the two differ. Type it again in both.</text>
<text x="20.40" y="559.50" fill="#3b82f6" textLength="42.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">Enter</text>
<text x="70.80" y="559.50" fill="#abb0b7" textLength="58.80" lengthAdjust="spacingAndGlyphs">Install</text>
<text x="146.40" y="559.50" fill="#3b82f6" textLength="25.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">Esc</text>
<text x="180.00" y="559.50" fill="#abb0b7" textLength="33.60" lengthAdjust="spacingAndGlyphs">Back</text>
<text x="230.40" y="559.50" fill="#3b82f6" textLength="25.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">F10</text>
<text x="264.00" y="559.50" fill="#abb0b7" textLength="33.60" lengthAdjust="spacingAndGlyphs">Quit</text>
