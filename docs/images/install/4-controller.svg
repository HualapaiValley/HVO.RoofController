<text x="28.80" y="55.50" fill="#abb0b7" textLength="201.60" lengthAdjust="spacingAndGlyphs">HVO Roof installer 4.0.0</text>
<text x="20.40" y="73.50" fill="#f8fafc" textLength="226.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">Step 4 of 7: The controller</text>
<text x="37.20" y="91.50" fill="#f8fafc" textLength="117.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">The controller</text>
<text x="28.80" y="109.50" fill="#f8fafc" textLength="554.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">The first admin, who signs in to the web UI and adds everyone else</text>
<text x="45.60" y="127.50" fill="#f8fafc" textLength="42.00" lengthAdjust="spacingAndGlyphs">Name:</text>
<text x="247.20" y="127.50" fill="#f8fafc" textLength="25.20" lengthAdjust="spacingAndGlyphs">roy</text>
<text x="45.60" y="145.50" fill="#f8fafc" textLength="336.00" lengthAdjust="spacingAndGlyphs">☑ A PIN too, for signing in at the kiosk</text>
<text x="45.60" y="163.50" fill="#f8fafc" textLength="537.60" lengthAdjust="spacingAndGlyphs">Added only while the controller has no admin. Empty adds nobody.</text>
<text x="28.80" y="199.50" fill="#f8fafc" textLength="579.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">The camera the controller shows (Blue Iris): empty leaves it as it is</text>
<text x="45.60" y="217.50" fill="#f8fafc" textLength="58.80" lengthAdjust="spacingAndGlyphs">Server:</text>
<text x="247.20" y="217.50" fill="#f8fafc" textLength="176.40" lengthAdjust="spacingAndGlyphs">http://192.168.0.4:81</text>
<text x="45.60" y="235.50" fill="#f8fafc" textLength="126.00" lengthAdjust="spacingAndGlyphs">View-only user:</text>
<text x="247.20" y="235.50" fill="#f8fafc" textLength="92.40" lengthAdjust="spacingAndGlyphs">roof-viewer</text>
<text x="45.60" y="253.50" fill="#fef9c3" textLength="764.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">Earlier versions held a Blue Iris credential in their source, and it is still in the public</text>
<text x="45.60" y="271.50" fill="#fef9c3" textLength="730.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">git history: give the controller a view-only user of its own, and change the old user's</text>
<text x="45.60" y="289.50" fill="#fef9c3" textLength="235.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">password (docs/security.md).</text>
<text x="28.80" y="325.50" fill="#f8fafc" textLength="520.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">Telemetry, exported over OTLP/HTTP: empty turns the export off</text>
<text x="45.60" y="343.50" fill="#f8fafc" textLength="75.60" lengthAdjust="spacingAndGlyphs">Endpoint:</text>
<text x="247.20" y="343.50" fill="#f8fafc" textLength="176.40" lengthAdjust="spacingAndGlyphs">http://collector:4318</text>
<text x="28.80" y="379.50" fill="#f8fafc" textLength="487.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">Settings from a backup, for a controller that has none yet</text>
<text x="45.60" y="397.50" fill="#f8fafc" textLength="84.00" lengthAdjust="spacingAndGlyphs">Full path:</text>
<text x="247.20" y="397.50" fill="#f8fafc" textLength="294.00" lengthAdjust="spacingAndGlyphs">/root/backup/appsettings.Local.json</text>
<text x="20.40" y="541.50" fill="#f8fafc" textLength="67.20" lengthAdjust="spacingAndGlyphs">⟦ Back ⟧</text>
<text x="112.80" y="541.50" fill="#f8fafc" textLength="84.00" lengthAdjust="spacingAndGlyphs">⟦► Next ◄⟧</text>
<text x="20.40" y="559.50" fill="#3b82f6" textLength="42.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">Enter</text>
<text x="70.80" y="559.50" fill="#abb0b7" textLength="33.60" lengthAdjust="spacingAndGlyphs">Next</text>
<text x="121.20" y="559.50" fill="#3b82f6" textLength="25.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">Esc</text>
<text x="154.80" y="559.50" fill="#abb0b7" textLength="33.60" lengthAdjust="spacingAndGlyphs">Back</text>
<text x="205.20" y="559.50" fill="#3b82f6" textLength="25.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">F10</text>
<text x="238.80" y="559.50" fill="#abb0b7" textLength="33.60" lengthAdjust="spacingAndGlyphs">Quit</text>
