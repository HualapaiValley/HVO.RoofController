<text x="28.80" y="55.50" fill="#abb0b7" textLength="201.60" lengthAdjust="spacingAndGlyphs">HVO Roof installer 4.0.0</text>
<text x="20.40" y="73.50" fill="#f8fafc" textLength="235.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">Step 2 of 6: What to install</text>
<text x="37.20" y="91.50" fill="#f8fafc" textLength="126.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">What to install</text>
<text x="28.80" y="109.50" fill="#f8fafc" textLength="604.80" lengthAdjust="spacingAndGlyphs">Choose what this machine is for. Roles this machine cannot have say why.</text>
<text x="28.80" y="145.50" fill="#f8fafc" textLength="613.20" lengthAdjust="spacingAndGlyphs">☐ Controller: drives the roof through the real HAT (the observatory's Pi)</text>
<text x="28.80" y="163.50" fill="#f8fafc" textLength="562.80" lengthAdjust="spacingAndGlyphs">☑ Test rig: the controller against the HAT emulator (nothing moves)</text>
<text x="28.80" y="181.50" fill="#aeb9c8" textLength="394.80" lengthAdjust="spacingAndGlyphs" opacity="0.6">☐ Kiosk: the touchscreen on the controller's Pi</text>
<text x="62.40" y="199.50" fill="#fef9c3" textLength="747.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">The kiosk needs a screen, and this Pi has no display outputs (/sys/class/drm lists none):</text>
<text x="62.40" y="217.50" fill="#fef9c3" textLength="512.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">connect the touchscreen, reboot, and run the installer again.</text>
<text x="28.80" y="235.50" fill="#f8fafc" textLength="294.00" lengthAdjust="spacingAndGlyphs">☐ hvo-roof: the command-line client</text>
<text x="28.80" y="253.50" fill="#aeb9c8" textLength="159.60" lengthAdjust="spacingAndGlyphs" opacity="0.6">☐ Mac app: HVO Roof</text>
<text x="62.40" y="271.50" fill="#fef9c3" textLength="378.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">The Mac app runs on a Mac with Apple silicon.</text>
<text x="28.80" y="307.50" fill="#fef9c3" textLength="756.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">This machine has the HAT's I2C bus (/dev/i2c-1). A test rig must never be installed on the</text>
<text x="28.80" y="325.50" fill="#fef9c3" textLength="655.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">observatory's Pi. Type this machine's host name (roofpi) to confirm it is not.</text>
<text x="28.80" y="343.50" fill="#f8fafc" textLength="50.40" lengthAdjust="spacingAndGlyphs">roofpi</text>
<text x="20.40" y="541.50" fill="#f8fafc" textLength="67.20" lengthAdjust="spacingAndGlyphs">⟦ Back ⟧</text>
