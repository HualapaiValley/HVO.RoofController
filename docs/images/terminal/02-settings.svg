<text x="28.80" y="523.50" fill="#d4d4d4" textLength="747.60" lengthAdjust="spacingAndGlyphs">Safety watchdog timeout (RoofControllerOptionsV4:SafetyWatchdogTimeout): 150 s (00:02:30)</text>
