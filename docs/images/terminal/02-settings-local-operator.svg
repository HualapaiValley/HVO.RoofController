<text x="37.20" y="109.50" fill="#f7f9fc" textLength="92.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">F2 Settings</text>
<text x="28.80" y="127.50" fill="#f7f9fc" textLength="655.20" lengthAdjust="spacingAndGlyphs">Version 1. Kept in memory only: changes are lost when the controller restarts.</text>
