<text x="28.80" y="469.50" fill="#f7f9fc" textLength="462.00" lengthAdjust="spacingAndGlyphs">Default camera (RoofControllerUi:DefaultCamera): (none)</text>
<text x="516.00" y="469.50" fill="#f7f9fc" textLength="117.60" lengthAdjust="spacingAndGlyphs">default (none)</text>
<text x="28.80" y="487.50" fill="#f7f9fc" textLength="966.00" lengthAdjust="spacingAndGlyphs">Read-only: Changing settings in local mode needs a Linux controller administrator with the Admin role. Use --remote</text>
<text x="28.80" y="505.50" fill="#f7f9fc" textLength="554.40" lengthAdjust="spacingAndGlyphs">with a password session to change settings permitted by your role.</text>
<text x="28.80" y="523.50" fill="#f7f9fc" textLength="134.40" lengthAdjust="spacingAndGlyphs">Notes: read-only</text>
<text x="28.80" y="541.50" fill="#f7f9fc" textLength="756.00" lengthAdjust="spacingAndGlyphs">The camera the clients show first (its Blue Iris short name). Null shows the first camera.</text>
<text x="28.80" y="559.50" fill="#f7f9fc" textLength="436.80" lengthAdjust="spacingAndGlyphs">[ Change ] [ Clear secret ] [ Reload ] [ Hand edit ]</text>
<text x="20.40" y="595.50" fill="#fecaca" textLength="949.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">Default camera cannot be changed: Changing settings in local mode needs a Linux controller administrator with the</text>
<text x="20.40" y="613.50" fill="#fecaca" textLength="764.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">Admin role. Use --remote with a password session to change settings permitted by your role.</text>
<text x="20.40" y="631.50" fill="#fecaca" textLength="151.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">[ Stop roof (F9) ]</text>
<text x="188.40" y="631.50" fill="#f7f9fc" textLength="210.00" lengthAdjust="spacingAndGlyphs">Stop is always available.</text>
