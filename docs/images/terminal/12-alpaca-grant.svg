<text x="37.20" y="55.50" fill="#98a7bb" textLength="226.80" lengthAdjust="spacingAndGlyphs">HVO roof: http://localhost/</text>
<text x="20.40" y="73.50" fill="#f7f9fc" textLength="67.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">HVO ROOF</text>
<text x="104.40" y="73.50" fill="#f7f9fc" font-weight="bold">|</text>
<text x="129.60" y="73.50" fill="#f7f9fc" textLength="235.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">ada (operator) · status live</text>
<text x="37.20" y="109.50" fill="#98a7bb" textLength="33.60" lengthAdjust="spacingAndGlyphs" opacity="0.6">F1 R</text>
<text x="87.60" y="109.50" fill="#f7f9fc" textLength="184.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">Allow this Close once?</text>
<text x="28.80" y="127.50" fill="#98a7bb" textLength="42.00" lengthAdjust="spacingAndGlyphs" opacity="0.6">LIVE:</text>
<text x="79.20" y="127.50" fill="#f7f9fc" textLength="873.60" lengthAdjust="spacingAndGlyphs">Allow one Alpaca Close despite: Telescope 'Guide' not clear of the roof; Telescope 'Main' state unknown.</text>
<text x="45.60" y="145.50" fill="#98a7bb" textLength="25.20" lengthAdjust="spacingAndGlyphs" opacity="0.6">ALP</text>
<text x="79.20" y="145.50" fill="#f7f9fc" textLength="848.40" lengthAdjust="spacingAndGlyphs">It was refused for ClientID 7 at 192.0.2.50 (reported by the Alpaca server); any Alpaca client's next</text>
<text x="37.20" y="163.50" fill="#98a7bb" textLength="33.60" lengthAdjust="spacingAndGlyphs" opacity="0.6">Alpa</text>
<text x="79.20" y="163.50" fill="#f7f9fc" textLength="176.40" lengthAdjust="spacingAndGlyphs">Close uses the grant.</text>
<text x="37.20" y="181.50" fill="#98a7bb" textLength="33.60" lengthAdjust="spacingAndGlyphs" opacity="0.6">Alpa</text>
<text x="79.20" y="181.50" fill="#f7f9fc" textLength="873.60" lengthAdjust="spacingAndGlyphs">The grant lasts 5 min and is used up by one Close, which may still be refused for a new reason. It never</text>
<text x="37.20" y="199.50" fill="#98a7bb" textLength="33.60" lengthAdjust="spacingAndGlyphs" opacity="0.6">Oper</text>
<text x="79.20" y="199.50" fill="#f7f9fc" textLength="856.80" lengthAdjust="spacingAndGlyphs">bypasses the fault latch, the interlocks, the limits, the motor protections, a person's operator lease</text>
<text x="37.20" y="217.50" fill="#98a7bb" textLength="33.60" lengthAdjust="spacingAndGlyphs" opacity="0.6">Warn</text>
<text x="79.20" y="217.50" fill="#f7f9fc" textLength="386.40" lengthAdjust="spacingAndGlyphs">or the Stop hold. It is logged with your name.</text>
<text x="37.20" y="235.50" fill="#98a7bb" textLength="33.60" lengthAdjust="spacingAndGlyphs" opacity="0.6">No o</text>
<text x="37.20" y="253.50" fill="#98a7bb" textLength="33.60" lengthAdjust="spacingAndGlyphs" opacity="0.6">Aler</text>
<text x="37.20" y="271.50" fill="#98a7bb" textLength="33.60" lengthAdjust="spacingAndGlyphs" opacity="0.6">roof</text>
<text x="28.80" y="487.50" fill="#98a7bb" textLength="42.00" lengthAdjust="spacingAndGlyphs" opacity="0.6">Close</text>
<text x="28.80" y="523.50" fill="#98a7bb" textLength="42.00" lengthAdjust="spacingAndGlyphs" opacity="0.6">[ Ope</text>
<text x="79.20" y="523.50" fill="#f7f9fc" textLength="210.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">[ Allow this Close once ]</text>
<text x="297.60" y="523.50" fill="#f7f9fc" textLength="84.00" lengthAdjust="spacingAndGlyphs">[ Cancel ]</text>
<text x="20.40" y="559.50" fill="#fecaca" textLength="151.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">[ Stop roof (F9) ]</text>
<text x="188.40" y="559.50" fill="#f7f9fc" textLength="210.00" lengthAdjust="spacingAndGlyphs">Stop is always available.</text>
<text x="20.40" y="577.50" fill="#58a6ff" textLength="16.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">F1</text>
<text x="45.60" y="577.50" fill="#98a7bb" textLength="33.60" lengthAdjust="spacingAndGlyphs">Roof</text>
<text x="96.00" y="577.50" fill="#58a6ff" textLength="16.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">F2</text>
<text x="121.20" y="577.50" fill="#98a7bb" textLength="67.20" lengthAdjust="spacingAndGlyphs">Settings</text>
<text x="205.20" y="577.50" fill="#58a6ff" textLength="16.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">F3</text>
<text x="230.40" y="577.50" fill="#98a7bb" textLength="50.40" lengthAdjust="spacingAndGlyphs">People</text>
<text x="297.60" y="577.50" fill="#58a6ff" textLength="16.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">F4</text>
<text x="322.80" y="577.50" fill="#98a7bb" textLength="50.40" lengthAdjust="spacingAndGlyphs">System</text>
<text x="390.00" y="577.50" fill="#58a6ff" textLength="16.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">F5</text>
<text x="415.20" y="577.50" fill="#98a7bb" textLength="42.00" lengthAdjust="spacingAndGlyphs">Setup</text>
<text x="474.00" y="577.50" fill="#58a6ff" textLength="16.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">F9</text>
<text x="499.20" y="577.50" fill="#98a7bb" textLength="75.60" lengthAdjust="spacingAndGlyphs">Stop roof</text>
<text x="591.60" y="577.50" fill="#58a6ff" textLength="25.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">F10</text>
<text x="625.20" y="577.50" fill="#98a7bb" textLength="33.60" lengthAdjust="spacingAndGlyphs">Quit</text>
