version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"

  # Workflows pin actions by full commit SHA (the repository requires it); Dependabot updates
  # the SHA and the "# vX.Y.Z" comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Pi image and HAT emulator image base images (mcr.microsoft.com/dotnet/sdk and aspnet), each
  # pinned by tag and by the digest of its multi-platform index (tag@sha256:...). Dependabot
  # updates the tag and the digest together, and proposes a new digest alone when the same tag
  # is republished (Microsoft rebuilds its images for base OS fixes).
  # Both Dockerfiles must use the same images, tag and digest (build/check-base-images.sh, in
  # the "Pi image" and "Emulator image" workflows), so each image is bumped in both Dockerfiles
  # in one PR (group-by: dependency-name).
  # The SDK tag must satisfy src/global.json and its patch roll-forward policy. A feature-band
  # change must update src/global.json in the same PR; a newer patch in its band is accepted.
  - package-ecosystem: "docker"
    directories:
      - "/src/HVO.RoofControllerV4.RPi"
      - "/src/HVO.RoofControllerV4.Emulator"
    schedule:
      interval: "weekly"
    groups:
      dotnet-images:
        group-by: dependency-name
        patterns:
          - "*"

  # Dev container image (mcr.microsoft.com/devcontainers/dotnet), pinned by tag and index digest.
  # Keep this ecosystem: Dependabot updates the tag and digest, including digest-only rebuilds.
  # Its SDK must be in the feature band that src/global.json pins; CI ("Check dev container SDK") fails until it is.
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
