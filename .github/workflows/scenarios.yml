name: Scenarios

# The commissioning checks (docs/commissioning.md) as automated scenarios against the emulated HAT, roof and VFD. No
# hardware is involved, and nothing is pushed or deployed.
#   scenarios            every [TestCategory("Scenario")] test, the short C14 and kiosk soaks included
#   browser              the web UI in Chromium with phone, tablet and desktop emulation ([TestCategory("Browser")])
#   container-scenarios  the Docker lifecycle, the container's supervisor and its two processes, the C12 deploy and
#                        rollback, the Compose migration, and a deploy of a pulled image
#                        (tests/emulator/deploy-scenarios.sh)
#   soak                 nightly and on demand: the C14 soak for HVO_SOAK_DURATION, with its invariant results
#   kiosk-soak           nightly and on demand: the touchscreen kiosk against the emulated roof for
#                        HVO_KIOSK_SOAK_DURATION, with its heap, threads and reconnects
# The release workflow runs this workflow as a gate (docs/releasing.md), without the soaks.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feature/** ]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      soak_duration:
        description: 'C14 soak duration, hh:mm:ss from 00:01:00 to 02:30:00 (the job times out at 180 minutes)'
        required: false
        default: '02:00:00'
      kiosk_soak_duration:
        description: 'Kiosk soak duration, hh:mm:ss from 00:01:00 to 00:45:00 (the job times out at 60 minutes)'
        required: false
        default: '00:30:00'
  workflow_call:

permissions:
  contents: read

concurrency:
  # The event is part of the group so a push to main does not cancel the nightly soak. The first part is literal: in a
  # called workflow github.workflow is the caller's name, and a group equal to the caller's would deadlock the two.
  group: scenarios-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  AVALONIA_TELEMETRY_OPTOUT: 1
  TEST_PROJECT: ../tests/HVO.RoofControllerV4.RPi.Tests/HVO.RoofControllerV4.RPi.Tests.csproj

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # dotnet resolves global.json from the working directory, so every dotnet command runs from src/.
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: src/global.json

      - name: Build
        run: |
          dotnet restore "$TEST_PROJECT" --configfile NuGet.config -v minimal
          dotnet build "$TEST_PROJECT" --no-restore -c Debug -v minimal -p:ContinuousIntegrationBuild=true

      - name: Scenarios
        env:
          HVO_SOAK_RESULTS_DIR: ${{ github.workspace }}/src/TestResults/soak
        run: >
          dotnet test "$TEST_PROJECT"
          --no-build -c Debug -v minimal
          --filter "TestCategory=Scenario"
          --logger "trx;LogFileName=scenarios.trx"
          --results-directory TestResults
          -- RunConfiguration.TreatNoTestsAsError=true

      - name: Soak summary
        if: always()
        run: |
          for summary in soak-summary.md kiosk-soak-summary.md; do
            if [ -f "TestResults/soak/$summary" ]; then
              cat "TestResults/soak/$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenario-results-${{ github.run_id }}
          path: src/TestResults/**
          if-no-files-found: warn
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: src/global.json

      - name: Build
        run: |
          dotnet restore "$TEST_PROJECT" --configfile NuGet.config -v minimal
          dotnet build "$TEST_PROJECT" --no-restore -c Debug -v minimal -p:ContinuousIntegrationBuild=true

      # The Chromium build that this Microsoft.Playwright version drives, and its system libraries.
      - name: Install Chromium
        run: pwsh ../tests/HVO.RoofControllerV4.RPi.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Browser tests
        run: >
          dotnet test "$TEST_PROJECT"
          --no-build -c Debug -v minimal
          --filter "TestCategory=Browser"
          --logger "trx;LogFileName=browser.trx"
          --results-directory TestResults
          -- RunConfiguration.TreatNoTestsAsError=true

      # Every page's screenshots (WebScreenshotTests), and a failed test's screenshot, trace and browser log.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-results-${{ github.run_id }}
          path: src/TestResults/**
          if-no-files-found: warn
          retention-days: 7

  container-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCN_RESULTS_DIR: ${{ github.workspace }}/deploy-scenario-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Lifecycle, supervisor, C12 deploy and rollback, Compose migration, pulled image
        run: tests/emulator/deploy-scenarios.sh

      - name: Summary
        if: always()
        run: |
          if [ -f "$SCN_RESULTS_DIR/deploy-scenarios.md" ]; then
            cat "$SCN_RESULTS_DIR/deploy-scenarios.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-scenario-results-${{ github.run_id }}
          path: deploy-scenario-results/**
          if-no-files-found: warn
          retention-days: 7

  soak:
    # A run of this workflow itself: a release's manual run is workflow_dispatch too, and calls this one as its gate.
    if: github.workflow == 'Scenarios' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: src
    env:
      HVO_SOAK_DURATION: ${{ inputs.soak_duration || '02:00:00' }}
      HVO_SOAK_RESULTS_DIR: ${{ github.workspace }}/soak-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The soak writes its results only when it ends, so a run the job's timeout cancels leaves nothing. A bare number
      # would parse as days. The value is not echoed back.
      - name: Check the soak duration
        run: |
          if [[ ! "${HVO_SOAK_DURATION}" =~ ^([0-9]{2}):([0-5][0-9]):([0-5][0-9])$ ]]; then
            echo "::error::soak_duration must be hh:mm:ss, such as 02:00:00."
            exit 1
          fi
          seconds=$((10#${BASH_REMATCH[1]} * 3600 + 10#${BASH_REMATCH[2]} * 60 + 10#${BASH_REMATCH[3]}))
          if (( seconds < 60 || seconds > 9000 )); then
            echo "::error::soak_duration must be from 00:01:00 to 02:30:00, to finish within the job's 180-minute timeout."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: src/global.json

      - name: Build
        run: |
          dotnet restore "$TEST_PROJECT" --configfile NuGet.config -v minimal
          dotnet build "$TEST_PROJECT" --no-restore -c Debug -v minimal -p:ContinuousIntegrationBuild=true

      - name: C14 soak
        run: >
          dotnet test "$TEST_PROJECT"
          --no-build -c Debug -v minimal
          --filter "TestCategory=Soak"
          --logger "trx;LogFileName=soak.trx"
          --results-directory TestResults
          -- RunConfiguration.TreatNoTestsAsError=true

      # The invariant checks, the timing table and the samples are written even when a check fails.
      - name: Soak summary
        if: always()
        run: |
          if [ -f "$HVO_SOAK_RESULTS_DIR/soak-summary.md" ]; then
            cat "$HVO_SOAK_RESULTS_DIR/soak-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The soak wrote no summary; see the test log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-results-${{ github.run_id }}
          path: |
            soak-results/**
            src/TestResults/**
          if-no-files-found: warn
          retention-days: 30

  # The kiosk (its console and its screen, drawn headless at the Pi Touch Display 2's size) against the emulated roof:
  # unlock, Open, Stop in mid-travel, Close, lock, with a controller restart every fourth cycle. It fails if a Stop is not
  # acknowledged, a restart is not one reconnect, or the heap or the threads grow after the warm-up.
  kiosk-soak:
    # As the C14 soak: not when a release calls this workflow.
    if: github.workflow == 'Scenarios' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src
    env:
      HVO_KIOSK_SOAK_DURATION: ${{ inputs.kiosk_soak_duration || '00:30:00' }}
      HVO_SOAK_RESULTS_DIR: ${{ github.workspace }}/kiosk-soak-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # As the C14 soak: a bare number would parse as days, and a run the job's timeout cancels writes nothing.
      - name: Check the kiosk soak duration
        run: |
          if [[ ! "${HVO_KIOSK_SOAK_DURATION}" =~ ^([0-9]{2}):([0-5][0-9]):([0-5][0-9])$ ]]; then
            echo "::error::kiosk_soak_duration must be hh:mm:ss, such as 00:30:00."
            exit 1
          fi
          seconds=$((10#${BASH_REMATCH[1]} * 3600 + 10#${BASH_REMATCH[2]} * 60 + 10#${BASH_REMATCH[3]}))
          if (( seconds < 60 || seconds > 2700 )); then
            echo "::error::kiosk_soak_duration must be from 00:01:00 to 00:45:00, to finish within the job's 60-minute timeout."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: src/global.json

      - name: Build
        run: |
          dotnet restore "$TEST_PROJECT" --configfile NuGet.config -v minimal
          dotnet build "$TEST_PROJECT" --no-restore -c Debug -v minimal -p:ContinuousIntegrationBuild=true

      - name: Kiosk soak
        run: >
          dotnet test "$TEST_PROJECT"
          --no-build -c Debug -v minimal
          --filter "TestCategory=KioskSoak"
          --logger "trx;LogFileName=kiosk-soak.trx"
          --results-directory TestResults
          -- RunConfiguration.TreatNoTestsAsError=true

      - name: Kiosk soak summary
        if: always()
        run: |
          if [ -f "$HVO_SOAK_RESULTS_DIR/kiosk-soak-summary.md" ]; then
            cat "$HVO_SOAK_RESULTS_DIR/kiosk-soak-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The kiosk soak wrote no summary; see the test log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload kiosk soak results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kiosk-soak-results-${{ github.run_id }}
          path: |
            kiosk-soak-results/**
            src/TestResults/**
          if-no-files-found: warn
          retention-days: 30
