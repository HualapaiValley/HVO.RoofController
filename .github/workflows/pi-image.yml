name: Pi image

# Builds the controller's container image from a clean builder, for linux/arm64 (the Raspberry Pi) and linux/amd64 (a
# PC running the HAT emulator: the release publishes both, docs/releasing.md), so a Dockerfile, base-image or SDK-pin
# problem shows up here rather than during a release or a deployment. Nothing is pushed or deployed.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/HVO.RoofControllerV4.RPi/**'
      - 'src/HVO.RoofControllerV4.Common/**'
      - 'src/HVO.RoofControllerV4.Client/**'
      - 'src/HVO.RoofControllerV4.Web/**'
      - 'src/HVO.WebSite.Themes/**'
      - 'src/global.json'
      - 'src/NuGet.config'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'build/**'
      - 'Directory.Packages.props'
      - '.dockerignore'
      - '.github/workflows/pi-image.yml'
  pull_request:
    branches: [ main, feature/** ]
    paths:
      - 'src/HVO.RoofControllerV4.RPi/**'
      - 'src/HVO.RoofControllerV4.Common/**'
      - 'src/HVO.RoofControllerV4.Client/**'
      - 'src/HVO.RoofControllerV4.Web/**'
      - 'src/HVO.WebSite.Themes/**'
      - 'src/global.json'
      - 'src/NuGet.config'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'build/**'
      - 'Directory.Packages.props'
      - '.dockerignore'
      - '.github/workflows/pi-image.yml'
  schedule:
    # Weekly, to catch apt repository drift between code changes. The base images are pinned by digest, so they move
    # only through a pull request (Dependabot's, .github/dependabot.yml).
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Both Dockerfiles' base images: each pinned by tag and by the digest of an index holding linux/amd64 and
      # linux/arm64, the SDK tag src/global.json's, and the same SDK and runtime in both (build/check-base-images.sh).
      - name: Check the base image pins
        run: build/check-base-images.sh --registry

      # The version, commit and time the image carries (docs/releasing.md): a CI build, 4.0.0-ci.<run>.
      - name: Product version
        id: version
        run: |
          version=$(build/version.sh --ci "$GITHUB_RUN_NUMBER")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation for the runtime stage)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build linux/amd64 and linux/arm64 images (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/HVO.RoofControllerV4.RPi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          pull: true
          no-cache: true
          tags: hvo/roofcontrollerv4:ci-${{ github.sha }}
          build-args: |
            ROOF_VERSION=${{ steps.version.outputs.version }}
            ROOF_REVISION=${{ github.sha }}
            ROOF_CREATED=${{ steps.version.outputs.created }}
          # An OCI archive, so the next step can read each platform's labels without pushing or loading the image.
          outputs: type=oci,dest=${{ runner.temp }}/image.tar

      - name: Check the image's version labels
        run: build/check-image-labels.sh "$RUNNER_TEMP/image.tar" "${{ steps.version.outputs.version }}" "$GITHUB_SHA" linux/amd64,linux/arm64

      - name: Load the native image for web asset checks
        run: |
          docker buildx build --platform linux/amd64 --load \
            -f src/HVO.RoofControllerV4.RPi/Dockerfile \
            --build-arg ROOF_VERSION="${{ steps.version.outputs.version }}" \
            --build-arg ROOF_REVISION="$GITHUB_SHA" \
            --build-arg ROOF_CREATED="${{ steps.version.outputs.created }}" \
            -t hvo/roof-web-assets:check .

      - name: Check published web startup assets and live connection protection
        run: build/check-web-assets.sh hvo/roof-web-assets:check
