name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feature/** ]
  schedule:
    - cron: '0 2 * * *'
  # The release workflow runs this workflow as a gate (docs/releasing.md), and releases the programs it builds, tested
  # here with the release's version.
  workflow_call:
    inputs:
      version:
        description: 'The release version to build, such as 4.0.0 or 4.0.0-rc.1; empty for 4.0.0-ci.<run>'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # A literal first part: in a called workflow github.workflow is the caller's name, and a group equal to the caller's
  # would deadlock the two.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      TEST_PROJECT: ../tests/HVO.RoofControllerV4.RPi.Tests/HVO.RoofControllerV4.RPi.Tests.csproj
    defaults:
      run:
        # The dotnet host resolves global.json from the working directory upward, not from
        # the project path, so every dotnet command runs from src/ where the SDK pin lives.
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Every program built here is 4.0.0-ci.<run>, or the release's version when the release workflow runs this one
      # (docs/releasing.md). MSBuild reads the Version variable as a property, so every restore, build and publish below
      # gets it; the SDK adds the commit (+<sha>) from the checkout.
      - name: Product version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version=${RELEASE_VERSION:-$(../build/version.sh --ci "$GITHUB_RUN_NUMBER")}
          echo "Product version: ${version}"
          echo "Version=${version}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: src/global.json

      - name: Verify SDK selected by global.json
        run: |
          pin=$(jq -r '.sdk.version' global.json)
          actual=$(dotnet --version)
          echo "src/global.json pins SDK ${pin} (rollForward: $(jq -r '.sdk.rollForward' global.json)); dotnet resolves ${actual}"
          # rollForward "patch" accepts later patches in the pinned feature band.
          case "${actual}" in
            "${pin%??}"[0-9][0-9]) ;;
            *) echo "::error file=src/global.json::Resolved SDK ${actual} is not in the feature band of the pinned SDK ${pin}"; exit 1 ;;
          esac
          if [ "${actual##*.}" -lt "${pin##*.}" ]; then
            echo "::error file=src/global.json::Resolved SDK ${actual} is older than the pinned SDK ${pin}"
            exit 1
          fi

      # post-create.sh restores from src/ inside the dev container, so its SDK has to satisfy
      # global.json as well. Dependabot bumps the image tag; this catches a tag outside the band.
      - name: Check dev container SDK
        run: |
          pin=$(jq -r '.sdk.version' global.json)
          image=$(sed -n 's#^FROM \(mcr\.microsoft\.com/devcontainers/dotnet:[^ @]*\).*#\1#p' ../.devcontainer/Dockerfile | head -n 1)
          if [ -z "${image}" ]; then
            echo "::error file=.devcontainer/Dockerfile::No mcr.microsoft.com/devcontainers/dotnet FROM line found"
            exit 1
          fi
          sdk=$(docker buildx imagetools inspect "${image}" --format '{{json .Image}}' \
            | jq -r '."linux/amd64".config.Env[] | select(startswith("DOTNET_SDK_VERSION=")) | ltrimstr("DOTNET_SDK_VERSION=")')
          echo "src/global.json pins SDK ${pin}; ${image} ships SDK ${sdk:-unknown}"
          case "${sdk}" in
            "${pin%??}"[0-9][0-9]) ;;
            *) echo "::error file=.devcontainer/Dockerfile::Dev container SDK ${sdk:-unknown} is not in the feature band of the pinned SDK ${pin}"; exit 1 ;;
          esac
          if [ "${sdk##*.}" -lt "${pin##*.}" ]; then
            echo "::error file=.devcontainer/Dockerfile::Dev container SDK ${sdk} is older than the pinned SDK ${pin}"
            exit 1
          fi

      # Build the whole solution (what the README, CONTRIBUTING and the dev container use); the
      # tests run from the test project, which references everything else in it.
      - name: Restore
        run: dotnet restore HVO.RoofController.sln --configfile NuGet.config -v minimal

      - name: Build (Debug)
        run: dotnet build HVO.RoofController.sln --no-restore -c Debug -v minimal -p:ContinuousIntegrationBuild=true

      # Every unit and API test, including the WebApplicationFactory API tests, runs here. The
      # emulated commissioning scenarios, the browser tests and the soak run in scenarios.yml.
      # TreatNoTestsAsError fails the step if discovery finds nothing. The render tests save each screen, as the kiosk's
      # touchscreens and the Mac app's window show it, to HVO_KIOSK_RENDERS_DIR, and each of the installer's wizard pages
      # to HVO_INSTALLER_RENDERS_DIR (both uploaded below).
      - name: Test
        env:
          HVO_KIOSK_RENDERS_DIR: ${{ github.workspace }}/src/TestResults/kiosk-renders
          HVO_INSTALLER_RENDERS_DIR: ${{ github.workspace }}/src/TestResults/installer-renders
        run: >
          dotnet test "$TEST_PROJECT"
          --no-build -c Debug -v minimal
          --filter "TestCategory!=Scenario&TestCategory!=Browser&TestCategory!=Soak"
          --settings coverage.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults
          -- RunConfiguration.TreatNoTestsAsError=true

      - name: Verify coverage report is not empty
        run: |
          shopt -s globstar nullglob
          reports=(TestResults/**/coverage.cobertura.xml)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error::No coverage.cobertura.xml was produced under src/TestResults"
            exit 1
          fi
          for report in "${reports[@]}"; do
            lines=$(grep -o -m1 'lines-valid="[0-9]*"' "$report" | tr -dc '0-9')
            echo "${report}: lines-valid=${lines:-0}"
            if [ "${lines:-0}" -eq 0 ]; then
              echo "::error file=src/coverage.runsettings::${report} instruments no lines; check the coverlet Include filter"
              exit 1
            fi
          done

      # Directory.Build.props enables TreatWarningsAsErrors only for Release, which is what the
      # Pi image publishes. Restore again under Release so NuGet audit warnings fail here too.
      # The Debug output used by the test step above is left untouched.
      - name: Build (Release, warnings as errors)
        run: dotnet build HVO.RoofController.sln -c Release -v minimal -p:ContinuousIntegrationBuild=true

      # rcodesign signs the Mac programs ad hoc on Linux (no Xcode): hvo-roof for osx-arm64 and HVO Roof.app. Its release
      # is checked against a pinned SHA-256. Not RCODESIGN_*: rcodesign reads those variables as its own settings, and
      # refuses ones it does not know.
      - name: Install rcodesign
        env:
          APPLE_CODESIGN_VERSION: 0.29.0
          APPLE_CODESIGN_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
        run: |
          archive="apple-codesign-${APPLE_CODESIGN_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/${APPLE_CODESIGN_VERSION}/$archive.tar.gz"
          echo "${APPLE_CODESIGN_SHA256}  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$archive/rcodesign" --version
          echo "APPLE_CODESIGN=$RUNNER_TEMP/$archive/rcodesign" >> "$GITHUB_ENV"

      # hvo-roof as one self-contained file: linux-arm64 for the Pi, linux-x64 for development, and osx-arm64 for a Mac
      # with Apple silicon, signed ad hoc as the Mac app is (docs/cli.md). The mac-cli job runs it on a Mac.
      - name: Publish hvo-roof
        run: |
          for rid in linux-arm64 linux-x64 osx-arm64; do
            dotnet publish HVO.RoofControllerV4.Cli -c Release -r "$rid" -v minimal -p:ContinuousIntegrationBuild=true -o "hvo-roof/$rid"
            test -x "hvo-roof/$rid/hvo-roof"
          done
          file hvo-roof/linux-arm64/hvo-roof | grep -q 'ARM aarch64'
          file hvo-roof/osx-arm64/hvo-roof | grep -q 'Mach-O 64-bit arm64'
          # The SDK signs it ad hoc under its file name; this signature names it as docs/cli.md does.
          "$APPLE_CODESIGN" sign --binary-identifier io.github.hualapaivalley.hvo-roof hvo-roof/osx-arm64/hvo-roof
          "$APPLE_CODESIGN" print-signature-info hvo-roof/osx-arm64/hvo-roof > cli-signature.txt
          grep -E '^ +(flags|identifier): ' cli-signature.txt
          grep -q 'flags: CodeSignatureFlags(ADHOC)' cli-signature.txt
          grep -q 'identifier: io.github.hualapaivalley.hvo-roof$' cli-signature.txt
          # The product version and this commit.
          expected="${Version}+${GITHUB_SHA}"
          actual=$(./hvo-roof/linux-x64/hvo-roof --version)
          echo "hvo-roof --version: ${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error file=Directory.Build.props::hvo-roof --version printed ${actual}, not ${expected}"
            exit 1
          fi

      # hvo-roof-kiosk as one self-contained file for the Pi (docs/kiosk.md), and for linux-x64 to check that the file
      # runs: with no device key it refuses its settings (exit 78) before it opens a display.
      - name: Publish hvo-roof-kiosk
        run: |
          for rid in linux-arm64 linux-x64; do
            dotnet publish HVO.RoofControllerV4.Kiosk -c Release -r "$rid" -v minimal -p:ContinuousIntegrationBuild=true -o "hvo-roof-kiosk/$rid"
            test -x "hvo-roof-kiosk/$rid/hvo-roof-kiosk"
          done
          file hvo-roof-kiosk/linux-arm64/hvo-roof-kiosk | grep -q 'ARM aarch64'
          status=0
          ./hvo-roof-kiosk/linux-x64/hvo-roof-kiosk 2> kiosk-stderr.txt || status=$?
          cat kiosk-stderr.txt
          if [ "$status" -ne 78 ] || ! grep -q 'The roof kiosk did not start' kiosk-stderr.txt; then
            echo "::error file=src/HVO.RoofControllerV4.Kiosk/Program.cs::hvo-roof-kiosk without settings exited ${status}, not 78 with its settings message"
            exit 1
          fi
          # The artifact: the Pi's program and its deploy files side by side, the directory docs/kiosk.md installs from.
          # Every file the page installs must be in it.
          mkdir kiosk-artifact
          cp hvo-roof-kiosk/linux-arm64/hvo-roof-kiosk HVO.RoofControllerV4.Kiosk/deploy/* kiosk-artifact/
          installs=$(grep -oP '^\s*sudo install -m [0-7]+ \K[^ ]+(?= )' ../docs/kiosk.md)
          test -n "$installs"
          for file in $installs; do
            if [ ! -f "kiosk-artifact/$file" ]; then
              echo "::error file=docs/kiosk.md::docs/kiosk.md installs ${file}, which the hvo-roof-kiosk artifact does not have"
              exit 1
            fi
          done
          ls -l kiosk-artifact

      # hvo-roof-install as one self-contained file for each machine it installs on: linux-arm64 (the Pi), linux-x64 (a
      # PC test rig) and osx-arm64 (a Mac). The linux-x64 file is run: its version, and --plan with no answers on a
      # machine with nothing recorded refuses (exit 2) and changes nothing.
      - name: Publish hvo-roof-install
        run: |
          for rid in linux-arm64 linux-x64 osx-arm64; do
            dotnet publish HVO.RoofControllerV4.Installer -c Release -r "$rid" -v minimal -p:ContinuousIntegrationBuild=true -o "hvo-roof-install/$rid"
            test -x "hvo-roof-install/$rid/hvo-roof-install"
          done
          file hvo-roof-install/linux-arm64/hvo-roof-install | grep -q 'ARM aarch64'
          file hvo-roof-install/linux-x64/hvo-roof-install | grep -q 'x86-64'
          file hvo-roof-install/osx-arm64/hvo-roof-install | grep -q 'Mach-O 64-bit arm64'
          expected="${Version}+${GITHUB_SHA}"
          actual=$(./hvo-roof-install/linux-x64/hvo-roof-install --version)
          echo "hvo-roof-install --version: ${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error file=Directory.Build.props::hvo-roof-install --version printed ${actual}, not ${expected}"
            exit 1
          fi
          status=0
          ./hvo-roof-install/linux-x64/hvo-roof-install --plan 2> install-stderr.txt || status=$?
          cat install-stderr.txt
          if [ "$status" -ne 2 ] || ! grep -q 'Nothing is recorded as installed here' install-stderr.txt; then
            echo "::error file=src/HVO.RoofControllerV4.Installer/Installer.cs::hvo-roof-install --plan with nothing recorded exited ${status}, not 2 with its message"
            exit 1
          fi

      # HVO Roof.app (docs/mac.md): published for osx-arm64 and made into the bundle, signed ad hoc by rcodesign, and
      # published for linux-x64 to check that the program refuses missing settings (exit 78) before it opens a window.
      # The mac-app job runs the bundle on a Mac.
      - name: Publish HVO Roof.app
        run: |
          for rid in osx-arm64 linux-x64; do
            dotnet publish HVO.RoofControllerV4.Mac -c Release -r "$rid" -v minimal -p:ContinuousIntegrationBuild=true -o "hvo-roof-mac/$rid"
            test -x "hvo-roof-mac/$rid/hvo-roof-mac"
          done
          file hvo-roof-mac/osx-arm64/hvo-roof-mac | grep -q 'Mach-O 64-bit arm64'
          status=0
          HVO_ROOF_MAC_SETTINGS="$RUNNER_TEMP/no-mac-settings" ./hvo-roof-mac/linux-x64/hvo-roof-mac --check 2> mac-stderr.txt || status=$?
          cat mac-stderr.txt
          if [ "$status" -ne 78 ] || ! grep -q 'HVO Roof did not start' mac-stderr.txt; then
            echo "::error file=src/HVO.RoofControllerV4.Mac/Program.cs::hvo-roof-mac without settings exited ${status}, not 78 with its settings message"
            exit 1
          fi
          version="${Version}"
          python3 HVO.RoofControllerV4.Mac/bundle/bundle.py make hvo-roof-mac/osx-arm64 mac-artifact \
            --version "$version" --build "$GITHUB_RUN_NUMBER" --rcodesign "$APPLE_CODESIGN"
          python3 HVO.RoofControllerV4.Mac/bundle/bundle.py check "mac-artifact/HVO Roof.app" --version "$version"
          "$APPLE_CODESIGN" print-signature-info "mac-artifact/HVO Roof.app/Contents/MacOS/hvo-roof-mac" > mac-signature.txt
          grep -E '^ +(flags|identifier): ' mac-signature.txt
          grep -q 'flags: CodeSignatureFlags(ADHOC)' mac-signature.txt
          grep -q 'identifier: io.github.hualapaivalley.roof$' mac-signature.txt
          # Zipped here, as the Finder would, so the programs keep their execute bits and the bundle its signature.
          (cd mac-artifact && zip -qry "hvo-roof-mac-${GITHUB_RUN_ID}.zip" "HVO Roof.app")

      - name: Upload hvo-roof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hvo-roof-${{ github.run_id }}
          path: |
            src/hvo-roof/*/hvo-roof
          if-no-files-found: error
          retention-days: 14

      - name: Upload hvo-roof-install
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hvo-roof-install-${{ github.run_id }}
          path: |
            src/hvo-roof-install/*/hvo-roof-install
          if-no-files-found: error
          retention-days: 14

      - name: Upload hvo-roof-kiosk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hvo-roof-kiosk-${{ github.run_id }}
          path: src/kiosk-artifact/
          if-no-files-found: error
          retention-days: 14

      # The zip as it is (archive: false): its name is the artifact's.
      - name: Upload HVO Roof.app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: src/mac-artifact/hvo-roof-mac-${{ github.run_id }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      # The kiosk's screens at 1280x720 (the Pi Touch Display 2) and 800x480 (the original 7-inch touchscreen), and the
      # Mac app's (mac-*) at 1280x800 and 960x600.
      - name: Upload kiosk renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kiosk-renders-${{ github.run_id }}
          path: src/TestResults/kiosk-renders/*.png
          if-no-files-found: warn
          retention-days: 14

      # The installer's wizard pages at 100x30, as ANSI (.ans) and drawn as SVG by tests/cli/ansi-to-svg.py: the
      # screenshots in docs/install.md.
      - name: Draw the installer renders
        if: always()
        run: |
          shopt -s nullglob
          for ans in TestResults/installer-renders/*.ans; do
            python3 ../tests/cli/ansi-to-svg.py "$ans" "${ans%.ans}.svg" --title hvo-roof-install
          done

      - name: Upload installer renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-renders-${{ github.run_id }}
          path: |
            src/TestResults/installer-renders/*.ans
            src/TestResults/installer-renders/*.svg
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.run_id }}
          path: src/TestResults/**
          if-no-files-found: warn
          retention-days: 7

  # HVO Roof.app on a Mac (Apple silicon): its signature, and the program opening and drawing its window (--check) with
  # settings, and refusing without them. Nothing here reaches a controller: the settings name a closed port.
  # The installer's kiosk steps on a real machine (docs/install.md, "The kiosk end to end"): apt, the hvo-kiosk user, the
  # files with their modes and owners, and systemd starting the Pi's kiosk program from this run's artifact, on an arm64
  # runner, as root. The runner is thrown away after, and has no screen: the kiosk logs where it would draw, then stops
  # there, which stays an assumption of docs/kiosk.md.
  installer-kiosk:
    needs: build-and-test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: src/global.json

      - name: Download hvo-roof-kiosk
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hvo-roof-kiosk-${{ github.run_id }}
          path: ${{ runner.temp }}/kiosk

      - name: Build the tests
        run: dotnet build ../tests/HVO.RoofControllerV4.RPi.Tests -c Release -v minimal

      # As root, as the installer runs for the kiosk. The test is skipped without HVO_KIOSK_INSTALL, so the summary must
      # show it passed, not skipped.
      - name: Install the kiosk
        run: |
          chmod +x "$RUNNER_TEMP/kiosk/hvo-roof-kiosk"
          sudo env "PATH=$PATH" "DOTNET_ROOT=${DOTNET_ROOT:-}" HOME=/root DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 \
            HVO_KIOSK_INSTALL=1 "HVO_KIOSK_PROGRAM=$RUNNER_TEMP/kiosk/hvo-roof-kiosk" \
            dotnet test ../tests/HVO.RoofControllerV4.RPi.Tests -c Release --no-build \
            --filter "TestCategory=KioskInstall" --logger "console;verbosity=normal" | tee kiosk-install.txt
          grep -q '^  Passed TheKiosk_IsInstalled_AndStartedBySystemd_AndASecondRunChangesNothing ' kiosk-install.txt

  # The installer's Mac app install (#71) for real on a Mac, as the person (InstallerMacSystemTests): the app the build
  # zipped, marked as downloaded, put in ~/Applications of a home of the test's own without the quarantine mark, its
  # device key made through the controller's API in process, its settings, and --check. And what the keychain step reads:
  # a keychain of the test's own listed by `security find-certificate -Z`, and SSL trust exported from the admin domain.
  installer-mac:
    needs: build-and-test
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: src/global.json

      - name: Download HVO Roof.app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hvo-roof-mac-${{ github.run_id }}.zip
          path: ${{ runner.temp }}/mac
          skip-decompress: true

      - name: Build the tests
        run: dotnet build ../tests/HVO.RoofControllerV4.RPi.Tests -c Release -v minimal

      # The test is skipped without HVO_MAC_INSTALL, so the summary must show it passed, not skipped.
      - name: Install the Mac app
        run: |
          HVO_MAC_INSTALL=1 HVO_MAC_APP_ZIP="$RUNNER_TEMP/mac/hvo-roof-mac-${GITHUB_RUN_ID}.zip" \
            dotnet test ../tests/HVO.RoofControllerV4.RPi.Tests -c Release --no-build \
            --filter "TestCategory=MacInstall" --logger "console;verbosity=normal" | tee mac-install.txt
          grep -q '^  Passed TheMacApp_IsInstalledWithoutQuarantine_WithItsKeyAndSettings_AndOpens_AndASecondRunChangesNothing ' mac-install.txt
          grep -q '^  Passed TheKeychainsListingAndTrustSettings_AreReadAsMacOsWritesThem ' mac-install.txt

  mac-app:
    needs: build-and-test
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Download HVO Roof.app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hvo-roof-mac-${{ github.run_id }}.zip
          skip-decompress: true

      - name: Check the signature
        run: |
          ditto -x -k "hvo-roof-mac-${GITHUB_RUN_ID}.zip" .
          codesign --verify --deep --strict --verbose=2 "HVO Roof.app"
          codesign -dv "HVO Roof.app" 2> codesign.txt
          cat codesign.txt
          grep -q '^Identifier=io.github.hualapaivalley.roof$' codesign.txt
          grep -q '^Signature=adhoc$' codesign.txt

      - name: Open and draw the window
        timeout-minutes: 3
        run: |
          settings="$RUNNER_TEMP/hvo-roof-mac"
          mkdir -p "$settings"
          printf '{ "Mac": { "ControllerUrl": "http://127.0.0.1:9/" } }\n' > "$settings/appsettings.Local.json"
          # Not a key any controller has: the one the settings name is not there.
          printf 'ci-mac-check-not-a-real-key\n' > "$settings/device-key"
          chmod 600 "$settings/device-key"
          # The exit code as well as the line: the app must also quit cleanly (sign out, close) after drawing.
          # stdout has the console log and the check's line; stderr has its refusals and anything the runtime or macOS
          # writes there.
          status=0
          HVO_ROOF_MAC_SETTINGS="$settings" "HVO Roof.app/Contents/MacOS/hvo-roof-mac" --check > check.txt 2> check-stderr.txt || status=$?
          cat check-stderr.txt check.txt
          if [ "$status" -ne 0 ] || ! grep -q '^HVO Roof check: the window opened and was drawn' check.txt; then
            echo "::error file=src/HVO.RoofControllerV4.Mac/MacCheck.cs::hvo-roof-mac --check exited ${status}; it must draw the window and exit 0"
            exit 1
          fi

      - name: Refuse without settings
        timeout-minutes: 2
        run: |
          status=0
          HVO_ROOF_MAC_SETTINGS="$RUNNER_TEMP/no-mac-settings" "HVO Roof.app/Contents/MacOS/hvo-roof-mac" --check 2> refusal.txt || status=$?
          cat refusal.txt
          if [ "$status" -ne 78 ] || ! grep -q 'HVO Roof did not start' refusal.txt; then
            echo "::error file=src/HVO.RoofControllerV4.Mac/Program.cs::hvo-roof-mac without settings exited ${status}, not 78 with its settings message"
            exit 1
          fi

  # hvo-roof on a Mac (Apple silicon), as docs/cli.md installs it: its signature and version, then setup (the credentials
  # file's modes) and the terminal interface in tmux (tests/cli/terminal-smoke.sh) against the controller and the HAT
  # emulator run with dotnet run (tests/cli/dotnet-run-smoke.sh), and the client's certificate checks. No hardware: the
  # roof is the emulator's.
  mac-cli:
    needs: build-and-test
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download hvo-roof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hvo-roof-${{ github.run_id }}
          path: ${{ runner.temp }}/hvo-roof

      # An artifact keeps no execute bits; a release's asset is downloaded the same way, and docs/cli.md sets the bit.
      - name: Check the signature and the version
        env:
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          cli="$RUNNER_TEMP/hvo-roof/osx-arm64/hvo-roof"
          chmod +x "$cli"
          codesign --verify --strict --verbose=2 "$cli"
          codesign -dv "$cli" 2> codesign.txt
          cat codesign.txt
          grep -q '^Identifier=io.github.hualapaivalley.hvo-roof$' codesign.txt
          grep -q '^Signature=adhoc$' codesign.txt
          expected="${VERSION}+${GITHUB_SHA}"
          actual=$("$cli" --version)
          echo "hvo-roof --version: ${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error file=Directory.Build.props::hvo-roof --version printed ${actual}, not ${expected}"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: src/global.json

      # tmux, and bash 4 or later for the scripts (the Mac's own bash is 3.2).
      - name: Install tmux and bash
        run: |
          brew install tmux bash
          tmux -V
          bash --version | head -n 1

      - name: Setup and the terminal interface against dotnet run
        timeout-minutes: 12
        env:
          TERMINAL_SMOKE_OUT: ${{ runner.temp }}/mac-terminal-screens
        run: HVO_ROOF_CLI="$RUNNER_TEMP/hvo-roof/osx-arm64/hvo-roof" tests/cli/dotnet-run-smoke.sh

      # The controller's certificate checked on macOS (#65), where X509Chain uses Apple's trust evaluation: a private CA,
      # a pin, and hvo-roof's setup with them, over real HTTPS to certificates made as the tests run. Debug, as
      # dotnet-run-smoke.sh built the controller.
      - name: Certificate tests on macOS
        timeout-minutes: 10
        working-directory: src
        run: >-
          dotnet test ../tests/HVO.RoofControllerV4.RPi.Tests -v minimal
          --filter "FullyQualifiedName~RoofCertificateAuthorityTests|FullyQualifiedName~RoofCertificatePinTests|FullyQualifiedName~RoofCliCaCertificateTests"
          --logger "trx;LogFileName=mac-certificates.trx" --results-directory "$RUNNER_TEMP/mac-terminal-screens"
          -- RunConfiguration.TreatNoTestsAsError=true

      # What each command wrote, each screen of the terminal interface as text and as an SVG image, the logs of the
      # controller and the emulator, and the certificate tests' results.
      - name: Upload the terminal screens
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-terminal-screens-${{ github.run_id }}
          path: ${{ runner.temp }}/mac-terminal-screens
          if-no-files-found: warn
          retention-days: 7

  # The Pi deploy path: the deploy script (against fake docker/curl, see tests/deploy), the container's supervisor
  # (tests/container) and the compose profiles.
  deploy-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Syntax and ShellCheck
        run: |
          bash -n src/HVO.RoofControllerV4.RPi/deploy-roofcontroller-rpi.sh
          bash -n tests/deploy/deploy-script-tests.sh
          bash -n tests/emulator/compose-smoke-test.sh
          bash -n tests/emulator/deploy-scenarios.sh
          bash -n tests/installer/rig-scenario.sh
          bash -n tests/cli/terminal-smoke.sh
          bash -n tests/cli/dotnet-run-smoke.sh
          for script in build/*.sh tests/versioning/*.sh tests/releasing/*.sh; do
            bash -n "${script}"
          done
          for script in src/HVO.RoofControllerV4.RPi/container/*.sh tests/container/*.sh tests/container/fake-*; do
            bash -n "${script}"
          done
          python3 -m py_compile tests/cli/ansi-to-svg.py tests/cli/test_ansi_to_svg.py tests/mac/test_bundle.py \
            src/HVO.RoofControllerV4.Mac/bundle/bundle.py src/HVO.RoofControllerV4.Mac/bundle/make-icns.py \
            build/release-compose.py tests/releasing/test_release_compose.py build/release-assets.py \
            tests/releasing/test_release_assets.py
          shellcheck --version
          shellcheck src/HVO.RoofControllerV4.RPi/deploy-roofcontroller-rpi.sh tests/deploy/deploy-script-tests.sh \
            tests/emulator/compose-smoke-test.sh tests/emulator/deploy-scenarios.sh tests/installer/rig-scenario.sh tests/cli/terminal-smoke.sh \
            tests/cli/dotnet-run-smoke.sh src/HVO.RoofControllerV4.RPi/container/*.sh tests/container/*.sh tests/container/fake-* \
            build/*.sh tests/versioning/*.sh tests/releasing/*.sh

      # build/version.sh (the product version and the release tag's check) and build/check-image-labels.sh.
      - name: Version script tests
        run: tests/versioning/version-tests.sh

      - name: Screenshot converter tests
        run: python3 -m unittest discover -s tests/cli -p 'test_*.py' -v

      # bundle.py reading whole and damaged Mach-O files, Info.plist and AppIcon.icns, and make on whole and damaged
      # publish folders (docs/mac.md).
      - name: Mac bundle script tests
        run: python3 -m unittest discover -s tests/mac -p 'test_*.py' -v

      # build/release-compose.py: the release compose file, and the sources it refuses. The Compose profiles step
      # checks the file it makes with Compose. build/release-assets.py: a release's assets, release.json and SHA256SUMS,
      # and the programs it refuses to release.
      - name: Release script tests
        run: python3 -m unittest discover -s tests/releasing -p 'test_*.py' -v

      # build/push-image.sh pushing two-platform OCI archives to a registry in Docker, and tagging them latest.
      - name: Image push script tests
        run: |
          skopeo --version
          tests/releasing/push-image-tests.sh

      # build/release-latest.sh deciding whether publishing a release moves latest, against a stand-in for gh.
      - name: Release latest script tests
        run: tests/releasing/release-latest-tests.sh

      - name: Deploy script tests
        run: tests/deploy/deploy-script-tests.sh

      # The container's supervisor and health check (src/HVO.RoofControllerV4.RPi/container), with stand-in processes.
      - name: Container supervisor tests
        run: tests/container/supervisor-tests.sh

      - name: Compose profiles
        working-directory: src/HVO.RoofControllerV4.RPi
        run: |
          docker compose --profile pi config --quiet
          docker compose --profile pi-lan-http config --quiet
          docker compose --profile emulator config --quiet
          # The emulator profile maps no devices, so it may run next to a Pi profile. The Pi services pin the HAT
          # emulator off, and the emulator services map no devices and use a network of their own.
          for profile in pi pi-lan-http; do
            docker compose --profile "${profile}" --profile emulator config --format json | jq -e '
              .services as $s
              | [$s[] | select(.profiles | index("emulator"))] as $emulated
              | [$s[] | select(.profiles | index("emulator") | not)] as $pi
              | ($pi | length) > 0 and ($emulated | length) == 2
                and ([$pi[].environment | .HatEmulator__Enabled, .HatEmulator__AllowOutsideDevelopment] | all(. == "false"))
                and ([$emulated[].devices // [] | length] | all(. == 0))
                and ([$emulated[].networks | keys[]] | all(. == "emulator"))
                and ([$pi[].networks // {} | keys[]] | index("emulator") | not)' >/dev/null || {
              echo "::error file=src/HVO.RoofControllerV4.RPi/docker-compose.yaml::the ${profile} and emulator profiles are not kept apart"
              exit 1
            }
          done
          # Every Pi service (the check and the controller) keeps the identity store in the writable identity mount:
          # the check probes that it can write there, and a store outside a mount is lost when the container is replaced.
          for profile in pi pi-lan-http; do
            docker compose --profile "${profile}" config --format json | jq -e '
              [.services[]
                | .environment.RoofControllerSecurity__Identity__StorePath as $store
                | ($store | type) == "string"
                  and ([.volumes[] | select(.target == "/var/lib/hvo-roof/identity" and (.read_only // false | not))] | length) == 1
                  and ($store | startswith("/var/lib/hvo-roof/identity/"))]
              | length == 2 and all' >/dev/null || {
              echo "::error file=src/HVO.RoofControllerV4.RPi/docker-compose.yaml::the ${profile} services do not all keep the identity store in a writable mount"
              exit 1
            }
          done
          # And the settings file and the managed secrets file in their writable mounts: the check probes both.
          for profile in pi pi-lan-http; do
            docker compose --profile "${profile}" config --format json | jq -e '
              [.services[]
                | .environment as $env
                | .volumes as $volumes
                | [["RoofControllerSettings__FilePath", "/etc/hvo-roof/config"],
                   ["RoofControllerSettings__SecretsFilePath", "/var/lib/hvo-roof/settings-secrets"]]
                | map(. as [$key, $dir]
                    | ($env[$key] | type) == "string"
                      and ($env[$key] | startswith($dir + "/"))
                      and ([$volumes[] | select(.target == $dir and (.read_only // false | not))] | length) == 1)
                | all]
              | length == 2 and all' >/dev/null || {
              echo "::error file=src/HVO.RoofControllerV4.RPi/docker-compose.yaml::the ${profile} services do not all keep the settings files in writable mounts"
              exit 1
            }
          done
          # The supervisor's default stop waits, from the script: the controller's must exceed the controller's own
          # ShutdownTimeout (Program.cs), and both, with a second for the supervisor's tick and a 2 s margin, must fit in
          # the containers' stop grace period and the deploy script's smallest stop timeout, or Docker kills the
          # container before the web UI has stopped.
          controller_stop=$(sed -n 's/^CONTROLLER_STOP_SECONDS=\${HVO_SUPERVISOR_CONTROLLER_STOP_SECONDS:-\([0-9]*\)}$/\1/p' container/roof-supervisor.sh)
          ui_stop=$(sed -n 's/^UI_STOP_SECONDS=\${HVO_SUPERVISOR_UI_STOP_SECONDS:-\([0-9]*\)}$/\1/p' container/roof-supervisor.sh)
          shutdown=$(sed -n 's/.*options\.ShutdownTimeout = TimeSpan\.FromSeconds(\([0-9]*\)).*/\1/p' Program.cs)
          deploy_stop=$(sed -n 's/^ *require_number STOP_TIMEOUT_SECONDS \([0-9]*\) .*/\1/p' deploy-roofcontroller-rpi.sh)
          if [[ -z "${controller_stop}" || -z "${ui_stop}" || -z "${shutdown}" || -z "${deploy_stop}" ]]; then
            echo "::error file=src/HVO.RoofControllerV4.RPi/container/roof-supervisor.sh::cannot read the stop times (controller ${controller_stop:-?} s, web UI ${ui_stop:-?} s, ShutdownTimeout ${shutdown:-?} s, deploy minimum ${deploy_stop:-?} s)"
            exit 1
          fi
          if (( controller_stop <= shutdown )); then
            echo "::error file=src/HVO.RoofControllerV4.RPi/container/roof-supervisor.sh::the supervisor waits ${controller_stop} s for the controller, not more than its ShutdownTimeout (${shutdown} s)"
            exit 1
          fi
          grace=$(( controller_stop + ui_stop + 1 + 2 ))
          if (( deploy_stop < grace )); then
            echo "::error file=src/HVO.RoofControllerV4.RPi/deploy-roofcontroller-rpi.sh::STOP_TIMEOUT_SECONDS may be ${deploy_stop} s, less than the supervisor's waits need (${grace} s)"
            exit 1
          fi
          # Every controller runs its web UI under the supervisor: container port 8088 published, with the API's scheme
          # (HTTPS where the API is HTTPS), the supervisor-aware health check, and a stop grace period that covers the
          # supervisor's waits (above).
          for profile in pi pi-lan-http emulator; do
            docker compose --profile "${profile}" config --format json | jq -e --argjson grace "${grace}" '
              [.services[] | select(.image | test("roof-controller"))
                | select(.command == null or (.command | index("--validate-deployment") | not))]
              | length == 1 and all(
                  (.environment.ASPNETCORE_URLS | test("https://") | if . then "https" else "http" end) as $scheme
                  | ([.ports[] | select(.target == 8088)] | length) == 1
                    and .environment.RoofWeb__Urls == ($scheme + "://+:8088")
                    and .healthcheck.test == ["CMD", "/usr/local/bin/roof-healthcheck"]
                    and (.stop_grace_period | rtrimstr("s") | tonumber) >= $grace)' >/dev/null || {
              echo "::error file=src/HVO.RoofControllerV4.RPi/docker-compose.yaml::the ${profile} controller does not publish its web UI on 8088 with the API's scheme, the supervisor's health check and a stop grace period of at least ${grace} s"
              exit 1
            }
          done
          # Both profiles at once must be rejected: they would drive the HAT twice.
          if docker compose --profile pi --profile pi-lan-http config --quiet 2>/dev/null; then
            echo "::error file=src/HVO.RoofControllerV4.RPi/docker-compose.yaml::the pi and pi-lan-http profiles can be enabled together"
            exit 1
          fi
          # The release compose file (build/release-compose.py, docs/releasing.md). Profile by profile it must be this
          # file with the release's images in place of the ones this file builds, and nothing else changed, so every
          # check above holds for it too.
          version=$(../../build/version.sh)
          release="${RUNNER_TEMP}/release-compose/docker-compose.yaml"
          mkdir -p "$(dirname "${release}")"
          ../../build/release-compose.py --version "${version}" -o "${release}"
          same='with_entries(select(.key | startswith("x-") | not)) | del(.services[].build, .services[].image, .services[].pull_policy)'
          for profile in pi pi-lan-http emulator; do
            docker compose -f "${release}" --profile "${profile}" config --quiet
            if ! diff <(docker compose -p hvo-roof -f docker-compose.yaml --profile "${profile}" config --format json | jq -S "${same}") \
                      <(docker compose -p hvo-roof -f "${release}" --profile "${profile}" config --format json | jq -S "${same}"); then
              echo "::error file=build/release-compose.py::the release compose file's ${profile} profile differs from docker-compose.yaml's in more than its images (above)"
              exit 1
            fi
            docker compose -f "${release}" --profile "${profile}" config --format json | jq -e --arg version "${version}" '
              [.services[]
                | .build == null and .pull_policy == null
                  and (.image == "ghcr.io/hualapaivalley/roof-controller:\($version)"
                    or .image == "ghcr.io/hualapaivalley/roof-hat-emulator:\($version)")]
              | length == 2 and all' >/dev/null || {
              echo "::error file=build/release-compose.py::a service of the release compose file's ${profile} profile builds, is never pulled, or names another image than the release's ${version}"
              exit 1
            }
          done
          if docker compose -f "${release}" --profile pi --profile pi-lan-http config --quiet 2>/dev/null; then
            echo "::error file=build/release-compose.py::the release compose file's pi and pi-lan-http profiles can be enabled together"
            exit 1
          fi
          # A release pins both images to their digests: Compose must read that file too, with each image pinned.
          pinned="${RUNNER_TEMP}/release-compose/pinned.yaml"
          controller_digest="sha256:$(printf controller | sha256sum | cut -c1-64)"
          emulator_digest="sha256:$(printf emulator | sha256sum | cut -c1-64)"
          ../../build/release-compose.py --version "${version}" --controller-digest "${controller_digest}" \
            --emulator-digest "${emulator_digest}" -o "${pinned}"
          for profile in pi pi-lan-http emulator; do
            docker compose -f "${pinned}" --profile "${profile}" config --format json | jq -e --arg version "${version}" \
                --arg controller "${controller_digest}" --arg emulator "${emulator_digest}" '
              [.services[]
                | .image == "ghcr.io/hualapaivalley/roof-controller:\($version)@\($controller)"
                  or .image == "ghcr.io/hualapaivalley/roof-hat-emulator:\($version)@\($emulator)"]
              | length == 2 and all' >/dev/null || {
              echo "::error file=build/release-compose.py::a service of the digest-pinned release compose file's ${profile} profile names another image than the release's, pinned"
              exit 1
            }
          done
          # The local development compose file (the controller against the emulator container). Its controller runs the
          # same supervisor, so its stop grace period must cover the same waits.
          docker compose -f ../docker-compose.yml config --format json | jq -e --argjson grace "${grace}" '
            .services.roofcontroller.stop_grace_period | rtrimstr("s") | tonumber >= $grace' >/dev/null || {
            echo "::error file=src/docker-compose.yml::the development controller's stop grace period is less than the supervisor's waits need (${grace} s)"
            exit 1
          }
