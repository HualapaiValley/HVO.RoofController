name: Release latest

# Moves the images' latest tag to a final release's images when the release is published (docs/releasing.md): each
# image named in the release's release.json, once its version tag is checked to still be the digest the release names.
# Only the newest final release moves it (build/release-latest.sh): a prerelease, or a fix to an older version, leaves
# latest alone.
#
# Publishing with the workflow token starts no workflow, so a workflow that publishes that way must run this one itself
# (workflow_call; the end-to-end tests will, #74). A manual run does the same for a tag.
on:
  release:
    types: [ published ]
  workflow_call:
    inputs:
      tag:
        description: 'The published release, such as v4.0.0'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'The published release, such as v4.0.0'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # One move at a time, never cancelled halfway.
  group: release-latest
  cancel-in-progress: false

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: The release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/release-latest.sh "${GITHUB_REPOSITORY}" "${TAG}" "${RUNNER_TEMP}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.release.outputs.move == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the images latest
        if: steps.release.outputs.move == 'true'
        run: |
          for image in controller hatEmulator; do
            reference=$(jq -r --arg image "${image}" '.images[$image].reference' "${RUNNER_TEMP}/release.json")
            repository=$(jq -r --arg image "${image}" '.images[$image].repository' "${RUNNER_TEMP}/release.json")
            digest=$(build/push-image.sh --tag "${reference}" latest)
            echo "${repository}:latest is ${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
