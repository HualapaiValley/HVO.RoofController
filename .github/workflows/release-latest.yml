name: Release latest

# Moves the images' latest tag to a final release's images when the release is published (docs/releasing.md): each
# image named in the release's release.json, once its version tag is checked to still be the digest the release names.
# A prerelease, or a release that is not the repository's latest (a fix to an older version), leaves latest alone.
#
# Publishing with the workflow token starts no workflow, so what publishes that way (the end-to-end tests) runs this one
# itself; a manual run does the same for a tag.
on:
  release:
    types: [ published ]
  workflow_call:
    inputs:
      tag:
        description: 'The published release, such as v4.0.0'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'The published release, such as v4.0.0'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # One move at a time, never cancelled halfway.
  group: release-latest
  cancel-in-progress: false

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: The release
        id: release
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${TAG}' is not a release tag."
            exit 1
          fi
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}") || {
            echo "::error::No published release for ${TAG}."
            exit 1
          }
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [ "$(jq -r .prerelease <<<"${release}")" = true ]; then
            echo "${TAG} is a prerelease: latest stays where it is." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "move=false" >> "$GITHUB_OUTPUT"
          elif [ "${latest}" != "${TAG}" ]; then
            echo "${TAG} is not the latest release (${latest} is): latest stays where it is." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "move=false" >> "$GITHUB_OUTPUT"
          else
            gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern release.json --dir "${RUNNER_TEMP}"
            jq -e --arg tag "${TAG}" '.tag == $tag and .prerelease == false' "${RUNNER_TEMP}/release.json" > /dev/null || {
              echo "::error::${TAG}'s release.json is for $(jq -r .tag "${RUNNER_TEMP}/release.json")."
              exit 1
            }
            echo "move=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.release.outputs.move == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the images latest
        if: steps.release.outputs.move == 'true'
        run: |
          for image in controller hatEmulator; do
            reference=$(jq -r --arg image "${image}" '.images[$image].reference' "${RUNNER_TEMP}/release.json")
            repository=$(jq -r --arg image "${image}" '.images[$image].repository' "${RUNNER_TEMP}/release.json")
            digest=$(build/push-image.sh --tag "${reference}" latest)
            echo "${repository}:latest is ${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
