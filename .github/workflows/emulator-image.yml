name: Emulator image

# Builds the HAT emulator image (src/HVO.RoofControllerV4.Emulator/Dockerfile) for linux/amd64 and linux/arm64, and
# runs the controller against it through the compose emulator profile (tests/emulator/compose-smoke-test.sh): the
# emulated roof opens and closes through the containerized controller, and the published hvo-roof command line and its
# terminal interface (in tmux) drive it (tests/cli/terminal-smoke.sh). No hardware is involved, and nothing is pushed
# or deployed.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/HVO.RoofControllerV4.Emulator/**'
      - 'src/HVO.RoofControllerV4.Simulation/**'
      - 'src/HVO.RoofControllerV4.Common/**'
      - 'src/HVO.RoofControllerV4.RPi/**'
      - 'src/HVO.RoofControllerV4.Client/**'
      - 'src/HVO.RoofControllerV4.Web/**'
      - 'src/HVO.RoofControllerV4.Cli/**'
      - 'src/global.json'
      - 'src/NuGet.config'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'build/**'
      - 'Directory.Packages.props'
      - '.dockerignore'
      - 'tests/emulator/**'
      - 'tests/cli/**'
      - '.github/workflows/emulator-image.yml'
  pull_request:
    branches: [ main, feature/** ]
    paths:
      - 'src/HVO.RoofControllerV4.Emulator/**'
      - 'src/HVO.RoofControllerV4.Simulation/**'
      - 'src/HVO.RoofControllerV4.Common/**'
      - 'src/HVO.RoofControllerV4.RPi/**'
      - 'src/HVO.RoofControllerV4.Client/**'
      - 'src/HVO.RoofControllerV4.Web/**'
      - 'src/HVO.RoofControllerV4.Cli/**'
      - 'src/global.json'
      - 'src/NuGet.config'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'build/**'
      - 'Directory.Packages.props'
      - '.dockerignore'
      - 'tests/emulator/**'
      - 'tests/cli/**'
      - '.github/workflows/emulator-image.yml'
  schedule:
    # Weekly, with the Pi image, to catch apt repository drift between code changes (the base images are pinned by
    # digest).
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-emulator-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Both Dockerfiles' base images: each pinned by tag and by the digest of an index holding linux/amd64 and
      # linux/arm64, the SDK tag src/global.json's, and the same SDK and runtime, tag and digest, in the emulator's
      # Dockerfile as in the Pi image's (build/check-base-images.sh).
      - name: Check the base image pins
        run: build/check-base-images.sh --registry

      # The version, commit and time the image carries (docs/releasing.md): a CI build, 4.0.0-ci.<run>.
      - name: Product version
        id: version
        run: |
          version=$(build/version.sh --ci "$GITHUB_RUN_NUMBER")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation for the runtime stage)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build linux/amd64 and linux/arm64 images (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/HVO.RoofControllerV4.Emulator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          pull: true
          no-cache: true
          tags: hvo/roof-hat-emulator:ci-${{ github.sha }}
          build-args: |
            ROOF_VERSION=${{ steps.version.outputs.version }}
            ROOF_REVISION=${{ github.sha }}
            ROOF_CREATED=${{ steps.version.outputs.created }}
          # An OCI archive, so the next step can read each platform's labels without pushing or loading the image.
          outputs: type=oci,dest=${{ runner.temp }}/image.tar

      - name: Check the image's version labels
        run: build/check-image-labels.sh "$RUNNER_TEMP/image.tar" "${{ steps.version.outputs.version }}" "$GITHUB_SHA" linux/amd64,linux/arm64

  # The controller image and the emulator image, built for the runner (linux/amd64) and run together through the
  # compose emulator profile.
  emulator-compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        # Keep CI on the current product SDK even while the dev-container minimum is older.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/roof-dotnet
        with:
          dotnet-version: '10.0.403'

      - name: Publish hvo-roof and install tmux
        working-directory: src
        run: |
          dotnet publish HVO.RoofControllerV4.Cli -c Release -r linux-x64 -o "${RUNNER_TEMP}/hvo-roof" -v minimal -p:ContinuousIntegrationBuild=true
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux

      - name: Open and close the emulated roof through the containerized controller, and with hvo-roof
        env:
          TERMINAL_SMOKE_OUT: ${{ runner.temp }}/terminal-screens
        run: HVO_ROOF_CLI="${RUNNER_TEMP}/hvo-roof/hvo-roof" tests/emulator/compose-smoke-test.sh

      # What each command wrote, and each screen of the terminal interface as text and as an SVG image.
      - name: Upload the terminal screens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-screens-${{ github.run_id }}
          path: ${{ runner.temp }}/terminal-screens
          if-no-files-found: warn
          retention-days: 7
